<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f3a5f'/%3E%3Cpath d='M7 22 13 15l5 4 7-9' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>Opportunity Tracking · AXCELAI</title>
    <script>
      (function () {
        var stored = localStorage.getItem('ot-theme');
        var theme =
          stored === 'dark' || stored === 'light'
            ? stored
            : 'dark';
        document.documentElement.setAttribute('data-theme', theme);

        var palettes = [
          'classic-blue',
          'royal-purple',
          'earth-autumn',
          'forest-teal',
          'corporate-light',
          'rose-maroon',
          'gold-forest',
          'midnight-purple',
        ];
        var palette = localStorage.getItem('ot-palette');
        document.documentElement.setAttribute(
          'data-palette',
          palettes.indexOf(palette) >= 0 ? palette : 'gold-forest',
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
