<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AxcelAI — Opportunity Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* =========================================================
     AxcelAI theme — dark, single visual world.
     Ground #0A0A0B · surface #161618 · accent #FF6B00 · radius 0
     Display: Space Grotesk · Body: Inter · Labels: JetBrains Mono
     ========================================================= */
  :root{
    --ink:#0A0A0B;
    --bg:#0A0A0B;
    --surface:#161618;
    --surface-alt:#1D1D20;
    --surface-sunk:#111113;
    --border:rgba(255,255,255,.16);
    --border-soft:rgba(255,255,255,.08);
    --text:#FFFFFF;
    --text-weak:#D1D5DB;
    --text-faint:#9CA3AF;
    --text-mute:#6B7280;
    --brand:#FF6B00;
    --brand-hover:#FF8533;
    --brand-deep:#CC5500;
    --brand-weak:rgba(255,107,0,.10);
    --path-future:#1D1D20;
    --path-future-text:#9CA3AF;
    --success:#22C55E;
    --success-weak:rgba(34,197,94,.10);
    --warning:#FFB75D;
    --warning-weak:rgba(255,183,93,.10);
    --error:#FF5C4C;
    --error-weak:rgba(255,92,76,.10);
    --opp-icon:#FF6B00;
    /* chart series — validated on the #161618 surface */
    --s1:#E56A0F; --s2:#3E8AE0; --s3:#1F9E74; --s4:#8F84E0;
    --grid:rgba(255,255,255,.07);
    --shadow:none;
    --shadow-lg:0 20px 50px rgba(0,0,0,.7);
    --radius:0px;
    --display:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--brand)}
  :focus-visible{outline:2px solid var(--brand);outline-offset:3px}
  .num{font-variant-numeric:tabular-nums}
  .hidden{display:none!important}
  h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;text-wrap:balance}

  /* ---------- Global header ---------- */
  .gnav{background:rgba(10,10,11,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--border-soft);
    display:flex;align-items:center;gap:14px;padding:12px 22px;position:relative;z-index:60}
  .waffle{display:grid;grid-template-columns:repeat(3,4px);gap:2px;padding:8px;background:transparent;border:0}
  .waffle:hover{background:rgba(255,255,255,.08)}
  .waffle i{width:4px;height:4px;background:var(--text-faint);display:block}
  .waffle:hover i{background:var(--brand)}
  .gnav-logo{height:24px;width:auto;display:block}
  .gnav-app{display:none}
  .gnav-div{width:1px;height:22px;background:var(--border-soft)}
  .gnav-ctx{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--text-faint);white-space:nowrap}
  .searchwrap{flex:1;max-width:520px;position:relative;display:flex;margin-left:8px}
  .searchwrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none;stroke:var(--text-mute)}
  .search{width:100%;background:var(--surface);border:1px solid var(--border-soft);border-radius:0;
    padding:8px 14px 8px 34px;color:var(--text);font-size:12.5px}
  .search::placeholder{color:var(--text-mute)}
  .search:focus{border-color:var(--brand);outline:none}
  .gicons{margin-left:auto;display:flex;align-items:center;gap:2px}
  .gicon{width:32px;height:32px;border:0;background:transparent;display:grid;place-items:center;color:var(--text-faint);position:relative}
  .gicon:hover{background:var(--surface);color:var(--brand)}
  .gicon .dot{position:absolute;top:6px;right:6px;width:6px;height:6px;background:var(--brand);border:1px solid var(--ink)}
  .avatar{width:28px;height:28px;background:var(--brand);color:#0A0A0B;display:grid;place-items:center;
    font-family:var(--mono);font-size:10px;font-weight:500;margin-left:8px;border:0;letter-spacing:.06em}

  .pop{position:absolute;top:56px;right:22px;width:300px;background:var(--surface);border:1px solid var(--border-soft);
    box-shadow:var(--shadow-lg);z-index:70;overflow:hidden}
  .pop h4{margin:0;padding:11px 14px;font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.18em;
    color:var(--brand);background:var(--surface-alt);border-bottom:1px solid var(--border-soft);font-weight:500}
  .pop .row{padding:11px 14px;border-bottom:1px solid var(--border-soft);display:block;width:100%;text-align:left;
    background:transparent;border-left:0;border-right:0;border-top:0;color:var(--text)}
  .pop .row:last-child{border-bottom:0}
  .pop .row:hover{background:var(--surface-alt)}
  .pop .row b{display:block;font-size:12.5px;font-weight:600}
  .pop .row span{font-size:11px;color:var(--text-mute)}
  .launcher{position:absolute;top:56px;left:22px;width:340px;background:var(--surface);border:1px solid var(--border-soft);
    box-shadow:var(--shadow-lg);z-index:70;padding:14px}
  .launcher-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border-soft)}
  .launcher-grid button{border:0;background:var(--surface);padding:16px 6px;text-align:center;
    font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-faint)}
  .launcher-grid button:hover{background:var(--surface-alt);color:var(--brand)}
  .launcher-grid .ic{display:block;font-size:17px;margin-bottom:7px}

  /* ---------- App nav ---------- */
  .anav{background:var(--ink);border-bottom:1px solid var(--border-soft);display:flex;align-items:stretch;gap:0;
    padding:0 22px;overflow-x:auto;position:sticky;top:0;z-index:40}
  .anav-label{display:flex;flex-direction:column;justify-content:center;padding:10px 26px 10px 0}
  .anav-label b{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
  .tab{border:0;background:transparent;color:var(--text-faint);padding:15px 15px 12px;white-space:nowrap;
    border-bottom:2px solid transparent;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.16em}
  .tab:hover{color:var(--text)}
  .tab.on{color:var(--brand);border-bottom-color:var(--brand)}

  /* ---------- Layout ---------- */
  main{padding:22px;max-width:1560px;margin:0 auto}
  .card{background:var(--surface);border:1px solid var(--border-soft);border-radius:0}
  .stack{display:flex;flex-direction:column;gap:14px}
  .cols2{display:grid;grid-template-columns:2fr 1fr;gap:14px;align-items:start}
  @media(max-width:980px){.cols2{grid-template-columns:1fr}}

  .phead{display:flex;align-items:flex-start;gap:16px;padding:22px 24px;flex-wrap:wrap}
  .ricon{width:38px;height:38px;display:grid;place-items:center;flex-shrink:0;background:transparent;border:1px solid var(--brand)}
  .ricon svg{fill:var(--brand)}
  .ricon.acct svg,.ricon.prod svg,.ricon.rep svg,.ricon.dash svg,.ricon.fcst svg,.ricon.cont svg{fill:var(--brand)}
  .ricon.acct,.ricon.prod,.ricon.rep,.ricon.dash,.ricon.fcst,.ricon.cont{background:transparent;border-color:var(--brand)}
  .ptext{flex:1;min-width:180px}
  .peyebrow{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.2em;color:var(--brand)}
  .ptitle{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1;margin:6px 0 0;letter-spacing:-.025em}
  .pmeta{font-size:12px;color:var(--text-faint);margin-top:6px}
  .pactions{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}

  .btn{border:1px solid var(--border);background:transparent;color:var(--text);border-radius:0;padding:8px 16px;
    font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.14em}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn:disabled:hover{border-color:var(--border);color:var(--text)}
  .btn-brand{background:var(--brand);border-color:var(--brand);color:#0A0A0B;font-weight:500}
  .btn-brand:hover:not(:disabled){background:var(--brand-hover);border-color:var(--brand-hover);color:#0A0A0B}
  .btn-danger{color:var(--error);border-color:rgba(255,92,76,.4)}
  .btn-danger:hover{background:var(--error-weak);border-color:var(--error);color:var(--error)}
  .btn-sm{padding:6px 12px;font-size:9.5px}

  /* ---------- Tiles ---------- */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--border-soft);
    border:1px solid var(--border-soft)}
  .tile{padding:20px 22px;background:var(--surface);border:0}
  .tile-l{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.18em;color:var(--text-mute)}
  .tile-v{font-family:var(--display);font-size:28px;font-weight:700;margin-top:10px;letter-spacing:-.03em;line-height:1.1}
  .tile-s{font-size:11.5px;color:var(--text-mute);margin-top:5px}
  .tile-bar{height:2px;background:var(--surface-alt);margin-top:14px;overflow:hidden}
  .tile-bar i{display:block;height:100%;background:var(--brand)}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex;align-items:center;gap:10px;padding:13px 20px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap}
  .toolbar b{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--text-weak);font-weight:500}
  .toolbar .grow{margin-left:auto}
  .count{font-family:var(--mono);font-size:10px;color:var(--text-mute);letter-spacing:.1em}
  .switch{display:flex;border:1px solid var(--border-soft)}
  .switch button{border:0;background:transparent;color:var(--text-faint);padding:7px 14px;
    font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;display:flex;align-items:center;gap:6px}
  .switch button+button{border-left:1px solid var(--border-soft)}
  .switch button.on{background:var(--brand);color:#0A0A0B}
  .switch button svg{display:none}
  select.filter,input.filter{border:1px solid var(--border-soft);background:var(--surface-alt);color:var(--text);
    border-radius:0;padding:6px 10px;font-size:12px}
  select.filter:focus,input.filter:focus{border-color:var(--brand);outline:none}
  input[type=checkbox]{accent-color:var(--brand)}

  /* ---------- Table ---------- */
  .tw{overflow-x:auto}
  table.lv{width:100%;border-collapse:collapse;min-width:1050px}
  table.lv th{text-align:left;font-family:var(--mono);font-size:9.5px;font-weight:400;text-transform:uppercase;
    letter-spacing:.16em;color:var(--text-mute);padding:0;background:var(--surface-alt);
    border-bottom:1px solid var(--border-soft);white-space:nowrap}
  table.lv th button{width:100%;text-align:left;background:transparent;border:0;padding:12px 18px;
    font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;display:flex;align-items:center;gap:6px}
  table.lv th button:hover{color:var(--brand)}
  table.lv th.num button{justify-content:flex-end}
  table.lv th.pad{padding:12px 18px}
  table.lv th .arrow{opacity:0;font-size:8px}
  table.lv th.sorted{color:var(--brand)}
  table.lv th.sorted .arrow{opacity:1}
  table.lv td{padding:14px 18px;border-bottom:1px solid var(--border-soft);vertical-align:top}
  table.lv td.num,table.lv th.num{text-align:right}
  table.lv tbody tr:hover{background:var(--surface-alt)}
  table.lv tbody tr.sel{background:var(--brand-weak)}
  table.lv tbody tr:last-child td{border-bottom:0}
  .lnk{color:var(--text);font-weight:600;background:none;border:0;padding:0;text-align:left;font-size:13.5px}
  .lnk:hover{color:var(--brand)}
  .sub{display:block;font-size:11px;color:var(--text-mute);margin-top:3px}
  .trunc{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{padding:56px 20px;text-align:center;color:var(--text-mute)}
  .empty b{display:block;font-family:var(--display);font-size:18px;color:var(--text);margin-bottom:8px;letter-spacing:-.02em}
  .rowmenu{background:transparent;border:1px solid transparent;padding:3px 8px;color:var(--text-mute);line-height:1}
  .rowmenu:hover{border-color:var(--brand);color:var(--brand)}

  /* ---------- Pills ---------- */
  .pill{display:inline-block;padding:4px 9px;border-radius:0;font-family:var(--mono);font-size:9px;
    text-transform:uppercase;letter-spacing:.13em;white-space:nowrap;border:1px solid var(--border)}
  .p-open{background:var(--brand-weak);color:var(--brand);border-color:var(--brand)}
  .p-won{background:var(--success-weak);color:var(--success);border-color:var(--success)}
  .p-lost{background:var(--error-weak);color:var(--error);border-color:var(--error)}
  .p-early{background:transparent;color:var(--text-faint);border-color:var(--border)}
  .probwrap{display:flex;align-items:center;gap:9px;justify-content:flex-end}
  .probbar{width:44px;height:3px;background:var(--surface-alt);overflow:hidden;flex-shrink:0}
  .probbar i{display:block;height:100%;background:var(--brand)}

  /* ---------- Kanban ---------- */
  .kbwrap{overflow-x:auto;padding:16px}
  .kb{display:flex;gap:1px;min-width:min-content;align-items:stretch;background:var(--border-soft)}
  .kcol{width:214px;flex-shrink:0;background:var(--ink);display:flex;flex-direction:column}
  .khead{padding:12px 14px;background:var(--surface-alt);border-bottom:1px solid var(--border-soft)}
  .khead b{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.14em;display:block;color:var(--text-weak);line-height:1.5;font-weight:400}
  .khead span{font-family:var(--mono);font-size:9.5px;color:var(--text-mute);margin-top:5px;display:block}
  .kbody{background:var(--ink);padding:12px;min-height:120px;display:flex;flex-direction:column;gap:10px;flex:1}
  .kbody.over{background:var(--brand-weak);outline:1px dashed var(--brand);outline-offset:-4px}
  .kcard{background:var(--surface);border:1px solid var(--border-soft);border-left:2px solid var(--brand);
    padding:12px;text-align:left;width:100%;cursor:grab}
  .kcard:hover{border-color:var(--border);border-left-color:var(--brand-hover)}
  .kcard.drag{opacity:.35}
  .kcard b{display:block;font-size:12.5px;color:var(--text);font-weight:600;line-height:1.35}
  .kamt{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.02em;margin-top:8px}
  .kmeta{font-family:var(--mono);font-size:9.5px;color:var(--text-mute);margin-top:4px;letter-spacing:.08em}
  .kcard.won{border-left-color:var(--success)}
  .kcard.lost{border-left-color:var(--error)}
  .kempty{font-family:var(--mono);font-size:9.5px;color:var(--text-mute);text-align:center;padding:24px 4px;letter-spacing:.14em;text-transform:uppercase}

  /* ---------- Path ---------- */
  .pathwrap{padding:18px 20px;border-bottom:1px solid var(--border-soft)}
  .pathscroll{overflow-x:auto;padding-bottom:6px}
  .path{display:flex;gap:2px;min-width:min-content;list-style:none;margin:0;padding:0}
  .path button{background:var(--path-future);color:var(--path-future-text);font-family:var(--mono);font-size:9px;
    text-transform:uppercase;letter-spacing:.1em;padding:11px 16px 11px 24px;white-space:nowrap;border:0;min-width:128px;text-align:center;
    clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%,11px 50%)}
  .path li:first-child button{padding-left:16px;clip-path:polygon(0 0,calc(100% - 11px) 0,100% 50%,calc(100% - 11px) 100%,0 100%)}
  .path button:hover{background:var(--surface-alt);color:var(--text)}
  .path button.done{background:var(--brand-deep);color:#0A0A0B}
  .path button.cur{background:var(--brand);color:#0A0A0B;font-weight:500}
  .path button.won{background:var(--success);color:#0A0A0B}
  .path button.lost{background:var(--error);color:#0A0A0B}
  .pathstatus{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
  .pathstatus .lbl{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.16em;color:var(--text-mute)}
  .pathstatus .val{font-size:13px;font-weight:600;color:var(--text)}

  /* ---------- Highlights + fields ---------- */
  .hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:1px;background:var(--border-soft);
    border-top:1px solid var(--border-soft)}
  .hl>div{padding:16px 22px;border-right:0;background:var(--surface)}
  .hl .lbl{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.18em;color:var(--text-mute)}
  .hl .val{font-family:var(--display);font-size:17px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
  .rtabs{display:flex;gap:0;border-bottom:1px solid var(--border-soft);padding:0 14px;overflow-x:auto}
  .rtabs button{border:0;background:transparent;padding:13px 16px;color:var(--text-faint);border-bottom:2px solid transparent;
    white-space:nowrap;font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.16em}
  .rtabs button:hover{color:var(--text)}
  .rtabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:0 48px;padding:20px 24px;margin:0}
  .fld{padding:11px 0;border-bottom:1px solid var(--border-soft);display:grid;grid-template-columns:44% 1fr;gap:14px;align-items:baseline}
  .fld dt{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--text-mute)}
  .fld dd{margin:0;word-break:break-word;font-size:13px;color:var(--text)}
  .shead{grid-column:1/-1;font-family:var(--mono);font-size:9.5px;font-weight:500;text-transform:uppercase;letter-spacing:.2em;
    color:var(--brand);padding:24px 0 10px;border-bottom:1px solid var(--brand)}
  .shead:first-child{padding-top:0}
  .back{border:0;background:transparent;color:var(--text-faint);padding:0;display:inline-flex;align-items:center;gap:7px;
    margin-bottom:14px;font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.16em}
  .back:hover{color:var(--brand)}

  /* ---------- Activity / Chatter ---------- */
  .feed{padding:20px 24px;display:flex;flex-direction:column;gap:12px}
  .post{display:flex;gap:12px}
  .post .av{width:30px;height:30px;background:var(--brand);color:#0A0A0B;display:grid;place-items:center;
    font-family:var(--mono);font-size:9.5px;font-weight:500;flex-shrink:0}
  .post .bd{flex:1;background:var(--surface-alt);border:1px solid var(--border-soft);padding:12px 14px}
  .post .bd b{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--brand);font-weight:500}
  .post .bd time{font-family:var(--mono);font-size:9.5px;color:var(--text-mute);margin-left:8px;letter-spacing:.08em}
  .post .bd p{margin:7px 0 0;color:var(--text-weak);font-size:13px}
  .composer{display:flex;gap:10px;padding:20px 24px 0}
  .composer textarea{flex:1;border:1px solid var(--border-soft);background:var(--surface-alt);color:var(--text);
    padding:10px 12px;min-height:64px;resize:vertical;border-radius:0;font-size:13px}
  .composer textarea:focus{border-color:var(--brand);outline:none}
  .task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border-soft)}
  .task:last-child{border-bottom:0}
  .task input{margin-top:3px;width:14px;height:14px}
  .task .t-body{flex:1}
  .task b{font-size:12.5px;display:block;font-weight:600}
  .task span{font-family:var(--mono);font-size:9.5px;color:var(--text-mute);letter-spacing:.08em}
  .task.done b{text-decoration:line-through;color:var(--text-mute)}

  /* ---------- Modal ---------- */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.78);display:grid;place-items:center;z-index:100;padding:20px;backdrop-filter:blur(3px)}
  .modal{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-lg);width:100%;max-width:640px;
    max-height:90vh;display:flex;flex-direction:column;border-radius:0}
  .modal.wide{max-width:880px}
  .mhead{padding:18px 22px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:12px}
  .mhead h2{margin:0;font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.02em}
  .mhead .x{margin-left:auto;border:0;background:transparent;font-size:22px;line-height:1;color:var(--text-mute);padding:2px 8px}
  .mhead .x:hover{color:var(--brand)}
  .mbody{padding:22px;overflow:auto}
  .mbody p{color:var(--text-weak)}
  .mfoot{padding:16px 22px;border-top:1px solid var(--border-soft);display:flex;gap:10px;justify-content:flex-end;background:var(--surface-alt)}
  .fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:560px){.fgrid2{grid-template-columns:1fr}}
  .f label{display:block;font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;
    color:var(--text-mute);margin-bottom:6px}
  .f input,.f select,.f textarea{width:100%;border:1px solid var(--border-soft);background:var(--surface-alt);
    color:var(--text);border-radius:0;padding:9px 11px;font-size:13px}
  .f input:focus,.f select:focus,.f textarea:focus{border-color:var(--brand);outline:none}
  .f .hint{font-size:11.5px;color:var(--text-mute);margin-top:5px}
  .f.span2{grid-column:1/-1}
  .errline{color:var(--error);font-size:12px;margin-top:10px;font-family:var(--mono);letter-spacing:.06em}

  /* ---------- Toast ---------- */
  .toasts{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;
    gap:8px;align-items:center;pointer-events:none}
  .toast{background:var(--brand);color:#0A0A0B;padding:11px 20px;font-family:var(--mono);font-size:10.5px;
    text-transform:uppercase;letter-spacing:.12em;max-width:560px;font-weight:500}
  .toast.err{background:var(--error);color:#0A0A0B}
  .toast.info{background:var(--surface-alt);color:var(--text);border:1px solid var(--brand)}

  /* ---------- Charts ---------- */
  .chartcard{padding:22px 24px}
  .chart-h{font-family:var(--display);font-size:16px;font-weight:700;margin:0 0 4px;letter-spacing:-.02em}
  .chart-sub{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--text-mute);margin:0 0 20px}
  .legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:16px}
  .legend span{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:9.5px;
    text-transform:uppercase;letter-spacing:.12em;color:var(--text-faint)}
  .legend i{width:9px;height:9px;display:block}
  svg .gridline{stroke:var(--grid);stroke-width:1}
  svg .axis{fill:var(--text-mute);font-size:9.5px;font-family:var(--mono)}
  svg .vlabel{fill:var(--text);font-size:10px;font-weight:600}
  svg .clabel{fill:var(--text-faint);font-size:10px;font-family:var(--mono)}
  .charts2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:900px){.charts2{grid-template-columns:1fr}}
  .bar-row{display:grid;grid-template-columns:158px 1fr 96px;gap:14px;align-items:center;padding:7px 0}
  .bar-row .bl{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);
    text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-track{background:var(--surface-alt);height:18px;overflow:hidden}
  .bar-fill{height:100%;transition:width .45s cubic-bezier(.2,.8,.2,1)}
  .bar-row .bv{font-size:12.5px;font-weight:600;text-align:right}

  /* ---------- Note ---------- */
  .note{padding:22px 24px;border-left:2px solid var(--brand)}
  .note h3{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.2em;margin:0 0 14px;color:var(--brand);font-weight:500}
  .note p{font-size:12.5px;color:var(--text-faint);margin:12px 0 0;line-height:1.8}
  .note p strong{color:var(--text-weak)}
  .note code{background:var(--surface-alt);padding:2px 6px;font-family:var(--mono);font-size:11px;color:var(--text-weak)}
  .note table{width:100%;border-collapse:collapse;font-size:12.5px}
  .note th{text-align:left;font-family:var(--mono);font-weight:400;color:var(--text-mute);padding:8px 14px 8px 0;
    font-size:9.5px;text-transform:uppercase;letter-spacing:.14em}
  .note td{padding:8px 14px 8px 0;border-top:1px solid var(--border-soft);vertical-align:top;color:var(--text-faint)}

  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  @media(max-width:640px){.fgrid{padding:16px}.fld{grid-template-columns:1fr;gap:2px}main{padding:14px}}


  /* logo swaps with the mode; base state hides the light-mode wordmark */
  .gnav-logo.on-light,.logo.on-light{display:none}
  .gnav-logo.on-dark,.logo.on-dark{display:block}

  /* ================= LIGHT MODE =================
     A second selected palette, not an inversion. White ground, deepened
     orange (#E86100 fill / #A34700 small text) so the brand keeps contrast,
     chart series re-stepped for the light surface and re-validated. */
  :root{--brand-ink:var(--brand)}
:root[data-theme="light"]{
    --ink:#FFFFFF; --bg:#FFFFFF;
    --surface:#FAFAFA; --surface-alt:#F1F1F2; --surface-sunk:#F6F6F7;
    --border:rgba(0,0,0,.22); --border-soft:rgba(0,0,0,.10);
    --text:#0A0A0B; --text-weak:#374151; --text-faint:#5B616B; --text-mute:#8A8F98;
    --brand:#E86100; --brand-ink:#A34700; --brand-hover:#C25400; --brand-deep:#A34700;
    --brand-weak:rgba(232,97,0,.10);
    --path-future:#ECECEE; --path-future-text:#4B5563;
    --success:#12805C; --success-weak:rgba(18,128,92,.12);
    --warning:#B45309; --warning-weak:rgba(180,83,9,.10);
    --error:#C4271A; --error-weak:rgba(196,39,26,.09);
    --opp-icon:#E86100;
    --s1:#D95F00; --s2:#2A78D6; --s3:#1BAF7A; --s4:#4A3AA7;
    --grid:rgba(0,0,0,.09);
    --shadow-lg:0 20px 50px rgba(0,0,0,.18);
}
:root[data-theme="light"] .gnav{background:rgba(255,255,255,.92)}
:root[data-theme="light"] .gnav-logo.on-dark{display:none}
:root[data-theme="light"] .gnav-logo.on-light{display:block}
:root[data-theme="light"] .logo.on-dark{display:none}
:root[data-theme="light"] .logo.on-light{display:block}
:root[data-theme="light"] .waffle i{background:#5B616B}
:root[data-theme="light"] .btn-brand,:root[data-theme="light"] .switch button.on,:root[data-theme="light"] .toast,
:root[data-theme="light"] .path button.done,:root[data-theme="light"] .path button.cur,:root[data-theme="light"] .path button.won,:root[data-theme="light"] .path button.lost,
:root[data-theme="light"] .avatar,:root[data-theme="light"] .post .av{color:#FFFFFF}
:root[data-theme="light"] .cta{color:#FFFFFF}
:root[data-theme="light"] .toast.info{color:var(--text)}
:root[data-theme="light"] .peyebrow, :root[data-theme="light"] .shead, :root[data-theme="light"] .note h3, :root[data-theme="light"] .pop h4, :root[data-theme="light"] .post .bd b, :root[data-theme="light"] .fnote h4, :root[data-theme="light"] .tab.on, :root[data-theme="light"] .rtabs button.on, :root[data-theme="light"] .p-open, :root[data-theme="light"] .chart-eyebrow{color:var(--brand-ink)}
:root[data-theme="light"] .p-open{border-color:var(--brand-ink)}
  @media (prefers-color-scheme: light){
:root:not([data-theme="dark"]){
    --ink:#FFFFFF; --bg:#FFFFFF;
    --surface:#FAFAFA; --surface-alt:#F1F1F2; --surface-sunk:#F6F6F7;
    --border:rgba(0,0,0,.22); --border-soft:rgba(0,0,0,.10);
    --text:#0A0A0B; --text-weak:#374151; --text-faint:#5B616B; --text-mute:#8A8F98;
    --brand:#E86100; --brand-ink:#A34700; --brand-hover:#C25400; --brand-deep:#A34700;
    --brand-weak:rgba(232,97,0,.10);
    --path-future:#ECECEE; --path-future-text:#4B5563;
    --success:#12805C; --success-weak:rgba(18,128,92,.12);
    --warning:#B45309; --warning-weak:rgba(180,83,9,.10);
    --error:#C4271A; --error-weak:rgba(196,39,26,.09);
    --opp-icon:#E86100;
    --s1:#D95F00; --s2:#2A78D6; --s3:#1BAF7A; --s4:#4A3AA7;
    --grid:rgba(0,0,0,.09);
    --shadow-lg:0 20px 50px rgba(0,0,0,.18);
}
:root:not([data-theme="dark"]) .gnav{background:rgba(255,255,255,.92)}
:root:not([data-theme="dark"]) .gnav-logo.on-dark{display:none}
:root:not([data-theme="dark"]) .gnav-logo.on-light{display:block}
:root:not([data-theme="dark"]) .logo.on-dark{display:none}
:root:not([data-theme="dark"]) .logo.on-light{display:block}
:root:not([data-theme="dark"]) .waffle i{background:#5B616B}
:root:not([data-theme="dark"]) .btn-brand,:root:not([data-theme="dark"]) .switch button.on,:root:not([data-theme="dark"]) .toast,
:root:not([data-theme="dark"]) .path button.done,:root:not([data-theme="dark"]) .path button.cur,:root:not([data-theme="dark"]) .path button.won,:root:not([data-theme="dark"]) .path button.lost,
:root:not([data-theme="dark"]) .avatar,:root:not([data-theme="dark"]) .post .av{color:#FFFFFF}
:root:not([data-theme="dark"]) .cta{color:#FFFFFF}
:root:not([data-theme="dark"]) .toast.info{color:var(--text)}
:root:not([data-theme="dark"]) .peyebrow, :root:not([data-theme="dark"]) .shead, :root:not([data-theme="dark"]) .note h3, :root:not([data-theme="dark"]) .pop h4, :root:not([data-theme="dark"]) .post .bd b, :root:not([data-theme="dark"]) .fnote h4, :root:not([data-theme="dark"]) .tab.on, :root:not([data-theme="dark"]) .rtabs button.on, :root:not([data-theme="dark"]) .p-open, :root:not([data-theme="dark"]) .chart-eyebrow{color:var(--brand-ink)}
:root:not([data-theme="dark"]) .p-open{border-color:var(--brand-ink)}
  }
  .themetoggle{width:32px;height:32px;border:0;background:transparent;display:grid;place-items:center;color:var(--text-faint)}
  .themetoggle:hover{background:var(--surface);color:var(--brand)}
  .themetoggle .i-sun{display:none}
  :root[data-theme="light"] .themetoggle .i-sun{display:block}
  :root[data-theme="light"] .themetoggle .i-moon{display:none}
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]) .themetoggle .i-sun{display:block}
    :root:not([data-theme="dark"]) .themetoggle .i-moon{display:none}
  }
  :root[data-theme="dark"] .themetoggle .i-sun{display:none}
  :root[data-theme="dark"] .themetoggle .i-moon{display:block}

</style>

/* ===================== HELPERS ===================== */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function stageIdx(n){ for(var i=0;i<STAGES.length;i++){ if(STAGES[i].name===n) return i; } return -1; }
function probOf(n){ var i=stageIdx(n); return i<0?0:STAGES[i].prob; }
function amountOf(o){ if(o.eau==null||o.unitSet==null||o.cost==null) return null; return Math.round(o.eau*o.unitSet*o.cost); }
function usd(n){ return n==null?"—":"$"+Math.round(n).toLocaleString("en-US"); }
function k$(n){ return "$"+(Math.round(n*100)/100).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2})+"K"; }
function pillCls(s){ return s==="Closed Won"?"p-won":s==="Closed Lost"?"p-lost":(s==="Qualification"||s==="Prospecting")?"p-early":"p-open"; }
function isClosed(s){ return s==="Closed Won"||s==="Closed Lost"; }
function closeYear(c){ var m=/'(\d\d)/.exec(c||""); return m?("20"+m[1]):"—"; }
function initials(s){ return String(s||"?").replace(/[^A-Za-z ]/g,"").split(" ").filter(Boolean).slice(0,2).map(function(w){return w[0];}).join("").toUpperCase()||"?"; }
function sum(a){ return a.reduce(function(x,y){return x+(y||0);},0); }
function el(id){ return document.getElementById(id); }

function toast(msg,kind){
  var t=document.createElement("div");
  t.className="toast"+(kind?" "+kind:"");
  t.textContent=msg;
  el("toasts").appendChild(t);
  setTimeout(function(){ t.remove(); },2800);
}

function enrich(){

/* ===================== TOTALS ===================== */
function totals(list){
  var t={count:list.length,total:0,weighted:0,won:0,lost:0,open:0,openCount:0};
  list.forEach(function(o){
    if(o.amount==null) return;
    t.total+=o.amount; t.weighted+=o.amount*o.prob/100;
    if(o.stage==="Closed Won") t.won+=o.amount;
    else if(o.stage==="Closed Lost") t.lost+=o.amount;
    else { t.open+=o.amount; t.openCount++; }
  });
  return t;
}

function visibleOpps(){
  var q=state.search.trim().toLowerCase();
  var list=state.opps.filter(function(o){
    if(state.filterStage && o.stage!==state.filterStage) return false;
    if(state.filterPL && o.productLine!==state.filterPL) return false;
    if(!q) return true;
    return [o.name,o.part,o.account,o.endCustomer,o.project,o.application,o.productLine,o.stage,o.competitor,o.next,o.note,o.close]
      .join(" ").toLowerCase().indexOf(q)>=0;
  });
  var k=state.sort.key,d=state.sort.dir;
  list.sort(function(a,b){
    var x=a[k],y=b[k];
    if(k==="close"){ x=closeSortKey(a.close); y=closeSortKey(b.close); }
    if(k==="stage"){ x=stageIdx(a.stage); y=stageIdx(b.stage); }
    if(x==null) return 1; if(y==null) return -1;
    if(typeof x==="string") return d*x.localeCompare(y);
    return d*(x-y);
  });
  return list;
}
var MONTHS={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,June:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
function closeSortKey(c){
  var m=/^([A-Za-z]+)'(\d\d)$/.exec(c||"");
  if(!m) return 999999;
  return (2000+ +m[2])*12 + (MONTHS[m[1]]||0);
}

/* ===================== CHART HELPERS ===================== */
function hbars(items,opts){
  opts=opts||{};
  var max=Math.max.apply(null,items.map(function(i){return i.v;}).concat([1]));
  return items.map(function(i){
    var w=Math.max(i.v>0?2:0,i.v/max*100);
    return '<div class="bar-row"><div class="bl" title="'+esc(i.l)+'">'+esc(i.l)+'</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+w.toFixed(1)+'%;background:'+(i.c||"var(--s1)")+'"></div></div>'+
      '<div class="bv">'+(opts.fmt?opts.fmt(i.v):usd(i.v))+'</div></div>';
  }).join("");
}
function groupedColumns(cats,series,fmt){
  var W=520,H=210,padL=46,padR=10,padT=14,padB=30;
  var iw=W-padL-padR, ih=H-padT-padB;
  var max=0; series.forEach(function(s){ s.vals.forEach(function(v){ if(v>max) max=v; }); });
  max=max||1;
  var niceMax=Math.ceil(max/100)*100;
  var gw=iw/cats.length, bw=Math.min(26,(gw-14)/series.length);
  var out='<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" role="img">';
  for(var g=0;g<=4;g++){
    var y=padT+ih-(ih*g/4);
    out+='<line class="gridline" x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'"/>';
    out+='<text class="axis" x="'+(padL-6)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end">'+Math.round(niceMax*g/4)+'</text>';
  }
  cats.forEach(function(c,ci){
    var gx=padL+ci*gw;
    series.forEach(function(s,si){
      var v=s.vals[ci]||0;
      var h=Math.max(v>0?2:0,v/niceMax*ih);
      var x=gx+(gw-bw*series.length-2*(series.length-1))/2+si*(bw+2);
      var y=padT+ih-h;
      out+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+s.color+'"><title>'+esc(c+" · "+s.name+": "+fmt(v))+'</title></rect>';
      if(v>0) out+='<text class="vlabel" x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" font-size="9.5">'+Math.round(v)+'</text>';
    });
    out+='<text class="clabel" x="'+(gx+gw/2).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">'+esc(c)+'</text>';
  });
  out+='</svg>';
  return out;
}
function funnelChart(rows){
  var W=680,rowH=34,H=rows.length*rowH+10;
  var max=Math.max.apply(null,rows.map(function(r){return r.v;}).concat([1]));
  var out='<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" role="img">';
  rows.forEach(function(r,i){
    var w=Math.max(r.v>0?3:0,r.v/max*(W-360));
    var y=i*rowH+6;
    out+='<text class="clabel" x="150" y="'+(y+15)+'" text-anchor="end">'+esc(r.l)+'</text>';
    out+='<rect x="158" y="'+y+'" width="'+w.toFixed(1)+'" height="20" rx="4" fill="'+r.c+'"><title>'+esc(r.l+": "+usd(r.v))+'</title></rect>';
    out+='<text class="vlabel" x="'+(158+w+7).toFixed(1)+'" y="'+(y+14.5)+'">'+(r.v?usd(r.v):"—")+'</text>';
    out+='<text class="axis" x="'+(W-4)+'" y="'+(y+14.5)+'" text-anchor="end">'+r.n+'</text>';
  });
  out+='</svg>';
  return out;
}
function legend(items){
  return '<div class="legend">'+items.map(function(i){
    return '<span><i style="background:'+i.c+'"></i>'+esc(i.l)+'</span>';

}

  var pls=[]; state.opps.forEach(function(o){ if(pls.indexOf(o.productLine)<0) pls.push(o.productLine); });

  var head=pageHeader(ICON_OPP,"","Opportunities","MOBIS Design Funnel",
    list.length+" items · sorted by "+esc(state.sort.key)+" · "+(state.search?("matching “"+esc(state.search)+"” · "):"")+"filtered by Region: KR",
    '<button class="btn" id="btn-import">Import</button>'+
    '<button class="btn" id="btn-export">Export</button>'+

    tile("Total Pipeline",usd(t.total),t.count+" opportunities"+(list.filter(function(o){return o.amount==null;}).length?" · "+list.filter(function(o){return o.amount==null;}).length+" without an amount":""),100)+
    tile("Open Pipeline",usd(t.open),t.openCount+" open",t.total?t.open/t.total*100:0)+
    tile("Weighted Forecast",usd(t.weighted),"Amount × probability",t.total?t.weighted/t.total*100:0)+
    tile("Closed Won",usd(t.won),t.lost?("Closed Lost: "+usd(t.lost)):"No losses recorded",t.total?t.won/t.total*100:0)+
  '</div>';

  var toolbar='<div class="toolbar">'+
    '<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-weak)">'+
      '<input type="checkbox" id="selall" '+(selIds.length&&selIds.length===list.length?"checked":"")+' aria-label="Select all" /> Select all</label>'+
    '<span class="count">'+list.length+' items · '+usd(t.total)+' total · '+usd(t.weighted)+' weighted</span>'+
    '<select class="filter" id="f-stage-filter"><option value="">All stages</option>'+
      STAGES.map(function(s){ return '<option'+(state.filterStage===s.name?" selected":"")+'>'+esc(s.name)+'</option>'; }).join("")+'</select>'+
    '<select class="filter" id="f-pl-filter"><option value="">All product lines</option>'+
      pls.map(function(p){ return '<option'+(state.filterPL===p?" selected":"")+'>'+esc(p)+'</option>'; }).join("")+'</select>'+
    (state.search||state.filterStage||state.filterPL?'<button class="btn btn-sm" id="clearf">Clear filters</button>':"")+
    '<span class="grow"></span>'+
    '<div class="switch"><button id="v-table" class="'+(state.view==="table"?"on":"")+'">Table</button>'+
      '<button id="v-kanban" class="'+(state.view==="kanban"?"on":"")+'">Kanban</button>'+
      '<button id="v-split" class="'+(state.view==="split"?"on":"")+'">Compact</button></div>'+
  '</div>';

  var body;
  if(!list.length){
    body='<div class="empty"><b>No opportunities match</b>Try clearing the search or filters.</div>';
  } else if(state.view==="kanban"){
    body=kanbanHTML(list);
  } else {
    body=tableHTML(list,state.view==="split");
  }

  return head+tiles+'<div class="card">'+toolbar+body+'</div>'+mappingNote();
}

function sortTh(key,label,isNum){
  var on=state.sort.key===key;
  return '<th class="'+(isNum?"num ":"")+(on?"sorted":"")+'"><button data-sort="'+key+'">'+esc(label)+
    '<span class="arrow">'+(on?(state.sort.dir>0?"▲":"▼"):"▲")+'</span></button></th>';
}
function tableHTML(list,compact){
  var cols = compact
    ? sortTh("name","Opportunity Name")+sortTh("stage","Stage")+sortTh("amount","Amount",true)+sortTh("close","Close Date",true)
    : sortTh("name","Opportunity Name")+'<th class="pad">Account / End Customer</th>'+sortTh("stage","Stage")+
      sortTh("amount","Amount",true)+sortTh("close","Close Date",true)+sortTh("prob","Probability",true)+
      sortTh("productLine","Product")+'<th class="pad">Next Step</th><th class="pad"></th>';
  return '<div class="tw"><table class="lv"'+(compact?' style="min-width:520px"':'')+'><thead><tr><th class="pad" style="width:34px"></th>'+cols+'</tr></thead><tbody>'+
    list.map(function(o){
      var sel=!!state.sel[o.id];
      var base='<tr class="'+(sel?"sel":"")+'">'+
        '<td><input type="checkbox" data-sel="'+o.id+'" '+(sel?"checked":"")+' aria-label="Select '+esc(o.name)+'" /></td>'+
        '<td><button class="lnk" data-open="'+o.id+'">'+esc(o.name)+'</button><span class="sub">'+esc(o.part)+' · '+esc(o.application)+'</span></td>';
      if(compact){
        return base+'<td><span class="pill '+pillCls(o.stage)+'">'+esc(o.stage)+'</span></td>'+
          '<td class="num">'+usd(o.amount)+'</td><td class="num">'+esc(o.close)+'</td></tr>';
      }
      return base+
        '<td>'+esc(o.account)+'<span class="sub">'+esc(o.endCustomer)+'</span></td>'+
        '<td><span class="pill '+pillCls(o.stage)+'">'+esc(o.stage)+'</span><span class="sub">Sheet: '+esc(o.designStatus)+'</span></td>'+
        '<td class="num">'+usd(o.amount)+(o.amount==null?'<span class="sub">TBD</span>':'<span class="sub">'+o.eau.toLocaleString("en-US")+' × '+o.unitSet+'</span>')+'</td>'+
        '<td class="num">'+esc(o.close)+'</td>'+
        '<td class="num"><div class="probwrap"><div class="probbar"><i style="width:'+o.prob+'%"></i></div><span>'+o.prob+'%</span></div></td>'+
        '<td>'+esc(o.productLine)+'<span class="sub">'+esc(o.project)+'</span></td>'+
        '<td><div class="trunc" title="'+esc(o.next)+'">'+esc(o.next)+'</div><span class="sub trunc" title="'+esc(o.note)+'">'+esc(o.note)+'</span></td>'+
        '<td><button class="rowmenu" data-edit="'+o.id+'" title="Edit">✎</button></td></tr>';
    }).join("")+'</tbody></table></div>';
}
function kanbanHTML(list){
  return '<div class="kbwrap"><div class="kb">'+STAGES.map(function(st){
    var inS=list.filter(function(o){ return o.stage===st.name; });
    var s=sum(inS.map(function(o){ return o.amount||0; }));
    var cards=inS.length?inS.map(function(o){
      var cls=o.stage==="Closed Won"?" won":o.stage==="Closed Lost"?" lost":"";
      return '<div class="kcard'+cls+'" draggable="true" data-card="'+o.id+'" tabindex="0" role="button">'+
        '<b>'+esc(o.name)+'</b><div class="kamt num">'+usd(o.amount)+'</div>'+
        '<div class="kmeta num">'+esc(o.close)+' · '+o.prob+'%</div>'+
        '<div class="kmeta">'+esc(o.competitor)+'</div></div>';
    }).join(""):'<div class="kempty">Drop here</div>';
    return '<div class="kcol"><div class="khead"><b>'+esc(st.name)+'</b><span class="num">'+inS.length+' · '+usd(s)+'</span></div>'+
      '<div class="kbody" data-drop="'+esc(st.name)+'">'+cards+'</div></div>';
  }).join("")+'</div></div>';
}
function mappingNote(){
  return '<div class="card note" style="margin-top:10px"><h3>How the sheet maps to Salesforce</h3>'+
    '<div class="tw"><table><thead><tr><th>Funnel status</th><th>Stage</th><th>Prob.</th><th>Signal used</th></tr></thead><tbody>'+
    STAGE_MAP.map(function(r){ return '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td class="num">'+r[2]+'%</td><td>'+esc(r[3])+'</td></tr>'; }).join("")+
    '</tbody></table></div>'+
    '<p><strong>Derived fields.</strong> Amount = <code>EAU × Unit/Set × Disty Cost</code> — the Funnel sheet has no revenue column. Probability is the Salesforce stage default. Close Date is the sheet\'s <code>M/P</code> start-of-production date in its original <code>Mon\'YY</code> form. Owner reads “Unassigned” because the sheet records no rep.</p>'+
    '<p><strong>Carried-over data issues.</strong> Column J is labelled <code>[Kpcs]</code> but holds figures like 294,009 — as thousands that would be 294 billion units, so amounts here read it as raw units. <code>ID511</code> is almost entirely <code>TBD</code> and so carries no Amount. <em>Prospecting</em> and <em>Closed Lost</em> are empty because nothing in the sheet belongs there.</p></div>';
}

/* ---------- RECORD ---------- */
function recordPage(){
  var o=state.opps.filter(function(x){return x.id===state.recordId;})[0];
  if(!o) return '<div class="card empty"><b>Record not found</b><button class="btn" data-go="opportunities">Back to list</button></div>';
  var si=stageIdx(o.stage), won=o.stage==="Closed Won", lost=o.stage==="Closed Lost";
  var nextStage = si>=0 && si<7 ? STAGES[si+1].name : "Closed Won";

  var path='<ol class="path">'+STAGES.map(function(st,k){
    var cls="";
    if(st.name==="Closed Won"&&won) cls="won";
    else if(st.name==="Closed Lost"&&lost) cls="lost";
    else if(k<si) cls="done";
    else if(k===si) cls="cur";
    return '<li><button class="'+cls+'" data-stage="'+esc(st.name)+'" title="Set stage to '+esc(st.name)+'">'+esc(st.name)+'</button></li>';
  }).join("")+'</ol>';

  var hl=[["Amount",usd(o.amount)],["Close Date (M/P)",o.close],["Stage",o.stage],["Probability",o.prob+"%"],["Owner",o.owner||"Unassigned"]]
    .map(function(p){ return '<div><div class="lbl">'+esc(p[0])+'</div><div class="val num">'+esc(p[1])+'</div></div>'; }).join("");

  var tabs=["Details","Activity","Chatter","Products","Related"];
  var tabsHTML='<div class="rtabs">'+tabs.map(function(t){
    return '<button class="'+(state.recordTab===t?"on":"")+'" data-rtab="'+t+'">'+t+'</button>';
  }).join("")+'</div>';

  var pane;
  if(state.recordTab==="Details") pane=detailsPane(o);
  else if(state.recordTab==="Activity") pane=activityPane(o);
  else if(state.recordTab==="Chatter") pane=chatterPane(o);
  else if(state.recordTab==="Products") pane=productsPane(o);
  else pane=relatedPane(o);

  return '<button class="back" data-go="opportunities"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 3.5L7 12l8.5 8.5 1.8-1.8L10.6 12l6.7-6.7z"/></svg> Back to MOBIS Design Funnel</button>'+
    '<div class="card"><div class="phead"><div class="ricon">'+ICON_OPP+'</div>'+
      '<div class="ptext"><div class="peyebrow">Opportunity</div><h1 class="ptitle">'+esc(o.name)+'</h1>'+
      '<div class="pmeta">'+esc(o.account)+' · '+esc(o.endCustomer)+' · Region '+esc(o.region)+' · Part '+esc(o.part)+'</div></div>'+
      '<div class="pactions">'+
        '<button class="btn" id="rec-edit">Edit</button>'+
        '<button class="btn" id="rec-clone">Clone</button>'+
        '<button class="btn btn-danger" id="rec-del">Delete</button>'+
        (isClosed(o.stage)?'<button class="btn" id="rec-reopen">Reopen</button>'
          :'<button class="btn btn-brand" id="rec-advance">Mark Stage as Complete</button>')+
      '</div></div>'+
      '<div class="hl">'+hl+'</div></div>'+
    '<div class="card" style="margin-top:10px"><div class="pathwrap"><div class="pathscroll">'+path+'</div>'+
      '<div class="pathstatus"><span class="lbl">Key Fields</span><span class="val">'+esc(o.next)+'</span>'+
      (isClosed(o.stage)?"":'<span class="lbl">· next stage: '+esc(nextStage)+'</span>')+'</div></div>'+
      tabsHTML+pane+'</div>';
}
function detailsPane(o){
  var margin=(o.resale&&o.cost)?((o.resale-o.cost)/o.resale*100).toFixed(2)+"%":"—";
  var f=[
    ["S","Opportunity Information"],
    ["Opportunity Name",o.name],["Account Name",o.account],["End Customer",o.endCustomer],
    ["Region",o.region],["Owner",o.owner||"Unassigned"],["Type","New Design Win"],
    ["S","Product & Design"],
    ["Project Name",o.project],["Application",o.application],["Product Line",o.productLine],
    ["Part Number",o.part],["Design Status (sheet)",o.designStatus],["Competitor Part#",o.competitor],
    ["S","Volume & Pricing"],
    ["EAU",o.eau==null?"TBD":o.eau.toLocaleString("en-US")],
    ["Unit / Set",o.unitSet==null?"TBD":String(o.unitSet)],
    ["Disty Cost (ASP)",o.cost==null?"TBD":"$"+o.cost],
    ["Resale (ASP)",o.resale==null?"TBD":"$"+o.resale],
    ["Disty Margin",margin],["Amount (derived)",usd(o.amount)],["FCST Flag",String(o.fcst)],
    ["S","Forecast & Next Steps"],
    ["Stage",o.stage],["Probability (%)",o.prob+"%"],["Close Date (M/P SoP)",o.close],
    ["Expected Revenue",o.amount==null?"—":usd(o.amount*o.prob/100)],
    ["Next Step",o.next],["Description",o.note]
  ];
  return '<dl class="fgrid">'+f.map(function(x){
    if(x[0]==="S") return '<div class="shead">'+esc(x[1])+'</div>';
    return '<div class="fld"><dt>'+esc(x[0])+'</dt><dd class="num">'+esc(x[1])+'</dd></div>';
  }).join("")+'</dl>';
}
function activityPane(o){
  var items=[];
  if(o.next&&o.next!=="—") items.push({t:"Next Step",b:o.next,m:"Open task · from the Funnel sheet"});
  if(o.note&&o.note!=="—") items.push({t:"Project Status",b:o.note,m:"Logged note · Pjt. Status/Note column"});
  items.push({t:"Close Date",b:"Mass production starts "+o.close,m:"Milestone · M/P column"});
  if(o.competitor&&o.competitor!=="TBD"&&o.competitor!=="—") items.push({t:"Competitive",b:"Displacing "+o.competitor,m:"Competitor Part# column"});
  return '<div class="feed">'+items.map(function(i){
    return '<div class="post"><div class="av">'+esc(initials(i.t))+'</div><div class="bd"><b>'+esc(i.t)+'</b>'+
      '<time>'+esc(i.m)+'</time><p>'+esc(i.b)+'</p></div></div>';
  }).join("")+
  '<p style="font-size:12px;color:var(--text-faint);margin-top:6px">Every item above is text carried from the sheet — no activity history was invented.</p></div>';
}
function chatterPane(o){

function productsPane(o){

    '<th class="pad num">Sales Price</th><th class="pad num">Total Price</th></tr></thead><tbody>'+

    '<td>'+esc(o.productLine)+'</td>'+

/* ===================== WIRING =====================
   Delegated handlers are attached to #app exactly once, at boot.
   render() only replaces #app's innerHTML, so re-attaching per render
   would stack duplicate handlers and fire each action N times. */
function wireOnce(){
  var app=el("app");

  app.addEventListener("click",function(e){
    var b;
    /* --- record-scoped actions --- */
    var o=state.recordId!=null ? state.opps.filter(function(x){return x.id===state.recordId;})[0] : null;
    if(o && state.page==="opportunities"){
      if((b=e.target.closest("[data-rtab]"))){ state.recordTab=b.dataset.rtab; render(); return; }
      if((b=e.target.closest("[data-stage]"))){
        var to=b.dataset.stage;
        if(o.stage!==to){ o.stage=to; enrich(); saveState(); render(); toast("Stage set to "+to); }
        return;
      }
      if(e.target.id==="rec-edit"){ editOpp(o.id); return; }
      if(e.target.id==="rec-del"){ deleteOpps([o.id]); return; }
      if(e.target.id==="rec-clone"){
        var c=Object.assign({},o); c.id=state.nextId++; c.name=o.name+" (Clone)";
        state.opps.push(c); enrich(); saveState(); go("opportunities",{recordId:c.id}); toast("Opportunity cloned"); return;
      }
      if(e.target.id==="rec-advance"){
        var i=stageIdx(o.stage);
        var to2 = i>=0 && i<7 ? STAGES[i+1].name : "Closed Won";
        o.stage=to2; enrich(); saveState(); render();
        toast(to2==="Closed Won"?("🎉 "+o.name+" marked Closed Won"):("Stage advanced to "+to2));
        return;
      }
      if(e.target.id==="rec-reopen"){ o.stage="Negotiation/Review"; enrich(); saveState(); render(); toast("Opportunity reopened at Negotiation/Review","info"); return; }
      if(e.target.id==="chatterpost"){
        var ta=el("chattertext"), v=ta.value.trim();
        if(!v){ toast("Write something first","err"); return; }
        if(!state.chatter[o.id]) state.chatter[o.id]=[];
        state.chatter[o.id].unshift({text:v,time:"just now"});
        saveState(); render(); toast("Posted to Chatter");
        return;
      }
    }

    /* --- list-scoped actions --- */
    if((b=e.target.closest("[data-sort]"))){
      var k=b.dataset.sort;
      state.sort = state.sort.key===k ? {key:k,dir:-state.sort.dir} : {key:k,dir:1};
      render(); return;
    }
    if((b=e.target.closest("[data-edit]"))){ editOpp(+b.dataset.edit); return; }
    if(e.target.id==="btn-import"){ importModal(); return; }
    if(e.target.id==="clearf"){ state.search=""; el("gsearch").value=""; state.filterStage=""; state.filterPL=""; render(); return; }
    if(e.target.id==="v-table"){ state.view="table"; render(); return; }
    if(e.target.id==="v-kanban"){ state.view="kanban"; render(); return; }
    if(e.target.id==="v-split"){ state.view="split"; render(); return; }
    if(e.target.id==="btn-owner"){ changeOwner(selectedIds()); return; }
    if(e.target.id==="btn-del"){ deleteOpps(selectedIds()); return; }
    if((b=e.target.closest("[data-card]"))){ go("opportunities",{recordId:+b.dataset.card}); return; }

    /* --- generic navigation --- */
    if((b=e.target.closest("[data-open]"))){ go("opportunities",{recordId:+b.dataset.open}); return; }
    if((b=e.target.closest("[data-go]"))){ go(b.dataset.go,{recordId:null,accountName:null,productPart:null,reportId:null}); return; }
    if((b=e.target.closest("[data-account]"))){ go("accounts",{accountName:b.dataset.account}); return; }
    if((b=e.target.closest("[data-product]"))){ go("products",{productPart:b.dataset.product}); return; }
    if((b=e.target.closest("[data-report]"))){ go("reports",{reportId:b.dataset.report}); return; }
    if((b=e.target.closest("[data-act]"))){ doAction(b.dataset.act); return; }
    if((b=e.target.closest("[data-delcontact]"))){ state.contacts.splice(+b.dataset.delcontact,1); saveState(); render(); toast("Contact deleted","info"); return; }
    if(e.target.id==="newopp"){ newOpp(); return; }
    if(e.target.id==="newcontact"){ newContact(); return; }
    if(e.target.id==="btn-export"){ exportCSV(); return; }
  });
  app.addEventListener("change",function(e){
    var t=e.target.closest("[data-task]");
    if(t){ state.doneTasks[t.dataset.task]=t.checked; saveState(); render(); return; }
    var c=e.target.closest("[data-sel]");
    if(c){ state.sel[c.dataset.sel]=c.checked; render(); return; }
    if(e.target.id==="selall"){
      var on=e.target.checked; state.sel={};
      if(on) visibleOpps().forEach(function(o){ state.sel[o.id]=true; });
      render(); return;
    }
    if(e.target.id==="f-stage-filter"){ state.filterStage=e.target.value; render(); return; }
    if(e.target.id==="f-pl-filter"){ state.filterPL=e.target.value; render(); return; }
  });
}

/* Kanban drag & drop — bound per render, because the cards are new nodes each time. */
function wireDnD(){
  var app=el("app");
  app.querySelectorAll("[data-card]").forEach(function(card){
    card.addEventListener("dragstart",function(e){
      e.dataTransfer.setData("text/plain",card.dataset.card);
      e.dataTransfer.effectAllowed="move";
      card.classList.add("drag");
    });
    card.addEventListener("dragend",function(){ card.classList.remove("drag"); });
    card.addEventListener("keydown",function(e){
      if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go("opportunities",{recordId:+card.dataset.card}); }
    });
  });
  app.querySelectorAll("[data-drop]").forEach(function(zone){
    zone.addEventListener("dragover",function(e){ e.preventDefault(); e.dataTransfer.dropEffect="move"; zone.classList.add("over"); });
    zone.addEventListener("dragleave",function(){ zone.classList.remove("over"); });
    zone.addEventListener("drop",function(e){
      e.preventDefault(); zone.classList.remove("over");
      var id=+e.dataTransfer.getData("text/plain");
      var o=state.opps.filter(function(x){return x.id===id;})[0];
      if(!o) return;
      var to=zone.dataset.drop;
      if(o.stage===to) return;
      o.stage=to; enrich(); saveState(); render();
      toast(o.name+" moved to "+to);
    });
  });
}
function selectedIds(){ return Object.keys(state.sel).filter(function(k){return state.sel[k];}).map(Number); }

/* ===================== BOOT ===================== */
wireOnce();
render();
})();
</script>

<script>
(function(){
  var root=document.documentElement, KEY="axcel_theme";
  function sysLight(){ return window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches; }
  try{ var saved=localStorage.getItem(KEY); if(saved) root.setAttribute("data-theme",saved); }catch(e){}
  var btn=document.getElementById("themetoggle");
  if(btn) btn.addEventListener("click",function(){
    var cur=root.getAttribute("data-theme") || (sysLight()?"light":"dark");
    var next=cur==="light"?"dark":"light";
    root.setAttribute("data-theme",next);
    try{ localStorage.setItem(KEY,next); }catch(e){}
  });
})();
</script>
</body>
