<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MOBIS Design Funnel — Sales</title>
<style>
  :root {
    --bg:#F3F3F3; --surface:#FFFFFF; --surface-alt:#FAFAF9; --surface-sunk:#EEF0F2;
    --border:#C9C9C9; --border-soft:#E5E5E5;
    --text:#181818; --text-weak:#5C5C5C; --text-faint:#8C8C8C;
    --brand:#0176D3; --brand-hover:#014486; --brand-deep:#032D60; --brand-weak:#EEF4FF;
    --path-future:#ECEBEA; --path-future-text:#514F4D;
    --success:#2E844A; --success-weak:#D7F2E0; --warning:#FE9339; --warning-weak:#FEF0E3;
    --error:#EA001E; --error-weak:#FEDED8; --opp-icon:#FCB95B;
    --s1:#0176D3; --s2:#E16032; --s3:#54A77B; --s4:#9050E9;
    --grid:#E8E8E8;
    --shadow:0 2px 2px rgba(0,0,0,.05); --shadow-lg:0 8px 24px rgba(0,0,0,.18);
    --radius:4px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#17181C; --surface:#232429; --surface-alt:#2A2B31; --surface-sunk:#1E1F24;
      --border:#3E3F45; --border-soft:#313238;
      --text:#F1F1F3; --text-weak:#A9AAB1; --text-faint:#7E7F87;
      --brand:#1B96FF; --brand-hover:#57A3FD; --brand-deep:#0B5CAB; --brand-weak:#16324D;
      --path-future:#34353C; --path-future-text:#A9AAB1;
      --success:#45C65A; --success-weak:#14361F; --warning:#FFB75D; --warning-weak:#3A2A12;
      --error:#FE5C4C; --error-weak:#481A17;
      --s1:#3987E5; --s2:#D95926; --s3:#199E70; --s4:#9085E9;
      --grid:#33343A;
      --shadow:0 2px 4px rgba(0,0,0,.4); --shadow-lg:0 10px 30px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --bg:#17181C; --surface:#232429; --surface-alt:#2A2B31; --surface-sunk:#1E1F24;
    --border:#3E3F45; --border-soft:#313238;
    --text:#F1F1F3; --text-weak:#A9AAB1; --text-faint:#7E7F87;
    --brand:#1B96FF; --brand-hover:#57A3FD; --brand-deep:#0B5CAB; --brand-weak:#16324D;
    --path-future:#34353C; --path-future-text:#A9AAB1;
    --success:#45C65A; --success-weak:#14361F; --warning:#FFB75D; --warning-weak:#3A2A12;
    --error:#FE5C4C; --error-weak:#481A17;
    --s1:#3987E5; --s2:#D95926; --s3:#199E70; --s4:#9085E9;
    --grid:#33343A;
    --shadow:0 2px 4px rgba(0,0,0,.4); --shadow-lg:0 10px 30px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--brand)}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:2px}
  .num{font-variant-numeric:tabular-nums}
  .hidden{display:none!important}

  /* ============ Global header ============ */
  .gnav{background:var(--brand-deep);display:flex;align-items:center;gap:10px;padding:8px 12px;position:relative;z-index:60}
  .waffle{display:grid;grid-template-columns:repeat(3,4px);gap:2px;padding:8px;background:transparent;border:0;border-radius:var(--radius)}
  .waffle:hover{background:rgba(255,255,255,.16)}
  .waffle i{width:4px;height:4px;background:#fff;border-radius:1px;display:block}
  .gnav-app{color:#fff;font-size:15px;font-weight:700;padding-right:12px;border-right:1px solid rgba(255,255,255,.25);white-space:nowrap}
  .searchwrap{flex:1;max-width:620px;position:relative;display:flex}
  .searchwrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none;opacity:.55}
  .search{width:100%;background:rgba(255,255,255,.94);border:1px solid transparent;border-radius:100px;padding:6px 14px 6px 34px;color:#181818}
  .search::placeholder{color:#5C5C5C}
  .gicons{margin-left:auto;display:flex;align-items:center;gap:2px}
  .gicon{width:30px;height:30px;border:0;background:transparent;border-radius:var(--radius);display:grid;place-items:center;color:#fff;position:relative}
  .gicon:hover{background:rgba(255,255,255,.16)}
  .gicon .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--error);border:1px solid var(--brand-deep)}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--opp-icon);color:#3E2C05;display:grid;place-items:center;font-size:11px;font-weight:700;margin-left:6px;border:0}

  .pop{position:absolute;top:46px;right:12px;width:290px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);z-index:70;overflow:hidden}
  .pop h4{margin:0;padding:9px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-weak);background:var(--surface-alt);border-bottom:1px solid var(--border-soft)}
  .pop .row{padding:9px 12px;border-bottom:1px solid var(--border-soft);display:block;width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0}
  .pop .row:last-child{border-bottom:0}
  .pop .row:hover{background:var(--surface-alt)}
  .pop .row b{display:block;font-size:12.5px}
  .pop .row span{font-size:11px;color:var(--text-faint)}
  .launcher{position:absolute;top:46px;left:12px;width:330px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);z-index:70;padding:12px}
  .launcher-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .launcher-grid button{border:1px solid var(--border-soft);background:var(--surface-alt);border-radius:var(--radius);padding:12px 6px;text-align:center;font-size:11.5px;font-weight:600;color:var(--text)}
  .launcher-grid button:hover{border-color:var(--brand);color:var(--brand)}
  .launcher-grid .ic{display:block;font-size:17px;margin-bottom:5px}

  /* ============ App nav ============ */
  .anav{background:var(--surface);border-bottom:1px solid var(--border-soft);display:flex;align-items:stretch;gap:2px;padding:0 12px;overflow-x:auto;position:sticky;top:0;z-index:40}
  .anav-label{display:flex;flex-direction:column;justify-content:center;padding:8px 18px 8px 4px}
  .anav-label b{font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
  .tab{border:0;background:transparent;color:var(--text-weak);padding:14px 13px 11px;white-space:nowrap;border-bottom:3px solid transparent}
  .tab:hover{color:var(--brand);background:var(--surface-alt)}
  .tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}

  /* ============ Layout ============ */
  main{padding:12px;max-width:1560px;margin:0 auto}
  .card{background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius);box-shadow:var(--shadow)}
  .stack{display:flex;flex-direction:column;gap:10px}
  .cols2{display:grid;grid-template-columns:2fr 1fr;gap:10px;align-items:start}
  @media(max-width:980px){.cols2{grid-template-columns:1fr}}

  .phead{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;flex-wrap:wrap}
  .ricon{width:40px;height:40px;border-radius:var(--radius);display:grid;place-items:center;flex-shrink:0;background:var(--opp-icon)}
  .ricon svg{fill:#fff}
  .ricon.acct{background:#7F8DE1}.ricon.prod{background:#0D9DDA}.ricon.rep{background:#5867E8}
  .ricon.dash{background:#EE6B6B}.ricon.fcst{background:#54A77B}.ricon.cont{background:#A094ED}
  .ptext{flex:1;min-width:180px}
  .peyebrow{font-size:11px;color:var(--text-weak);letter-spacing:.04em}
  .ptitle{font-size:20px;font-weight:700;line-height:1.2;margin:1px 0 0;letter-spacing:-.01em;text-wrap:balance}
  .pmeta{font-size:11px;color:var(--text-weak);margin-top:3px}
  .pactions{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start}

  .btn{border:1px solid var(--border);background:var(--surface);color:var(--brand);border-radius:var(--radius);padding:5px 14px;font-weight:500}
  .btn:hover{background:var(--surface-alt)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-brand{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn-brand:hover:not(:disabled){background:var(--brand-hover);border-color:var(--brand-hover)}
  .btn-danger{color:var(--error);border-color:var(--error)}
  .btn-danger:hover{background:var(--error-weak)}
  .btn-sm{padding:3px 10px;font-size:12px}

  /* ============ Tiles ============ */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:10px}
  .tile{padding:12px 14px}
  .tile-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-weak);font-weight:600}
  .tile-v{font-size:23px;font-weight:600;margin-top:4px;letter-spacing:-.02em}
  .tile-s{font-size:11.5px;color:var(--text-faint);margin-top:2px}
  .tile-bar{height:4px;border-radius:2px;background:var(--surface-sunk);margin-top:9px;overflow:hidden}
  .tile-bar i{display:block;height:100%;background:var(--brand);border-radius:2px}

  /* ============ Toolbar ============ */
  .toolbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap}
  .toolbar .grow{margin-left:auto}
  .count{font-size:11.5px;color:var(--text-weak)}
  .switch{display:flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .switch button{border:0;background:var(--surface);color:var(--text-weak);padding:5px 13px;font-size:12.5px;display:flex;align-items:center;gap:6px}
  .switch button+button{border-left:1px solid var(--border)}
  .switch button.on{background:var(--brand-weak);color:var(--brand);font-weight:600}
  select.filter,input.filter{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:4px 8px;font-size:12.5px}

  /* ============ Table ============ */
  .tw{overflow-x:auto}
  table.lv{width:100%;border-collapse:collapse;min-width:1050px}
  table.lv th{text-align:left;font-size:11px;font-weight:600;color:var(--text-weak);padding:0;background:var(--surface-alt);border-bottom:1px solid var(--border-soft);white-space:nowrap}
  table.lv th button{width:100%;text-align:left;background:transparent;border:0;padding:8px 12px;font-size:11px;font-weight:600;color:var(--text-weak);display:flex;align-items:center;gap:5px}
  table.lv th button:hover{color:var(--brand);background:var(--surface-sunk)}
  table.lv th.num button{justify-content:flex-end}
  table.lv th.pad{padding:8px 12px}
  table.lv th .arrow{opacity:0;font-size:9px}
  table.lv th.sorted .arrow{opacity:1}
  table.lv td{padding:9px 12px;border-bottom:1px solid var(--border-soft);vertical-align:top}
  table.lv td.num,table.lv th.num{text-align:right}
  table.lv tbody tr:hover{background:var(--surface-alt)}
  table.lv tbody tr.sel{background:var(--brand-weak)}
  table.lv tbody tr:last-child td{border-bottom:0}
  .lnk{color:var(--brand);font-weight:500;background:none;border:0;padding:0;text-align:left;font-size:13px}
  .lnk:hover{text-decoration:underline}
  .sub{display:block;font-size:11px;color:var(--text-faint);margin-top:1px}
  .trunc{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{padding:34px 16px;text-align:center;color:var(--text-faint)}
  .empty b{display:block;font-size:15px;color:var(--text-weak);margin-bottom:5px}
  .rowmenu{background:transparent;border:1px solid transparent;border-radius:var(--radius);padding:2px 7px;color:var(--text-weak);line-height:1}
  .rowmenu:hover{border-color:var(--border);background:var(--surface)}

  /* ============ Pills ============ */
  .pill{display:inline-block;padding:2px 9px;border-radius:100px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid transparent}
  .p-open{background:var(--brand-weak);color:var(--brand);border-color:var(--brand)}
  .p-won{background:var(--success-weak);color:var(--success);border-color:var(--success)}
  .p-lost{background:var(--error-weak);color:var(--error);border-color:var(--error)}
  .p-early{background:var(--surface-sunk);color:var(--text-weak);border-color:var(--border)}
  .probwrap{display:flex;align-items:center;gap:7px;justify-content:flex-end}
  .probbar{width:44px;height:4px;border-radius:2px;background:var(--surface-sunk);overflow:hidden;flex-shrink:0}
  .probbar i{display:block;height:100%;background:var(--brand)}

  /* ============ Kanban ============ */
  .kbwrap{overflow-x:auto;padding:12px}
  .kb{display:flex;gap:10px;min-width:min-content;align-items:flex-start}
  .kcol{width:210px;flex-shrink:0}
  .khead{padding:7px 10px;border-radius:var(--radius) var(--radius) 0 0;background:var(--surface-alt);border:1px solid var(--border-soft);border-bottom:0}
  .khead b{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;display:block;color:var(--text-weak)}
  .khead span{font-size:11.5px;color:var(--text-faint)}
  .kbody{background:var(--surface-sunk);border:1px solid var(--border-soft);border-radius:0 0 var(--radius) var(--radius);padding:8px;min-height:112px;display:flex;flex-direction:column;gap:8px}
  .kbody.over{background:var(--brand-weak);border-color:var(--brand);border-style:dashed}
  .kcard{background:var(--surface);border:1px solid var(--border-soft);border-left:3px solid var(--brand);border-radius:var(--radius);padding:9px 10px;text-align:left;width:100%;box-shadow:var(--shadow);cursor:grab}
  .kcard:hover{border-color:var(--brand)}
  .kcard.drag{opacity:.4}
  .kcard b{display:block;font-size:12.5px;color:var(--brand);font-weight:600;line-height:1.3}
  .kamt{font-size:14px;font-weight:600;margin-top:5px}
  .kmeta{font-size:11px;color:var(--text-faint);margin-top:2px}
  .kcard.won{border-left-color:var(--success)} .kcard.won b{color:var(--success)}
  .kcard.lost{border-left-color:var(--error)} .kcard.lost b{color:var(--error)}
  .kempty{font-size:11.5px;color:var(--text-faint);text-align:center;padding:18px 4px;font-style:italic}

  /* ============ Path ============ */
  .pathwrap{padding:12px 14px;border-bottom:1px solid var(--border-soft)}
  .pathscroll{overflow-x:auto;padding-bottom:4px}
  .path{display:flex;gap:3px;min-width:min-content;list-style:none;margin:0;padding:0}
  .path button{background:var(--path-future);color:var(--path-future-text);font-size:11px;font-weight:600;padding:8px 16px 8px 24px;white-space:nowrap;border:0;min-width:122px;text-align:center;
    clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%)}
  .path li:first-child button{padding-left:16px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%)}
  .path button:hover{filter:brightness(1.08)}
  .path button.done{background:var(--brand);color:#fff}
  .path button.cur{background:var(--brand-deep);color:#fff}
  .path button.won{background:var(--success);color:#fff}
  .path button.lost{background:var(--error);color:#fff}
  .pathstatus{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
  .pathstatus .lbl{font-size:11px;color:var(--text-weak)}
  .pathstatus .val{font-size:13px;font-weight:600}

  /* ============ Highlights + fields ============ */
  .hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr))}
  .hl>div{padding:10px 16px;border-right:1px solid var(--border-soft)}
  .hl>div:last-child{border-right:0}
  .hl .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-weak);font-weight:600}
  .hl .val{font-size:15px;font-weight:600;margin-top:2px}
  .rtabs{display:flex;gap:2px;border-bottom:1px solid var(--border-soft);padding:0 10px;overflow-x:auto}
  .rtabs button{border:0;background:transparent;padding:11px 14px;color:var(--text-weak);border-bottom:3px solid transparent;white-space:nowrap}
  .rtabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:0 40px;padding:14px 18px;margin:0}
  .fld{padding:7px 0;border-bottom:1px solid var(--border-soft);display:grid;grid-template-columns:42% 1fr;gap:12px;align-items:baseline}
  .fld dt{font-size:11.5px;color:var(--text-weak);font-weight:600}
  .fld dd{margin:0;word-break:break-word}
  .shead{grid-column:1/-1;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-weak);padding:16px 0 6px;border-bottom:2px solid var(--border-soft)}
  .shead:first-child{padding-top:0}
  .back{border:0;background:transparent;color:var(--brand);padding:0;display:inline-flex;align-items:center;gap:5px;margin-bottom:8px}
  .back:hover{text-decoration:underline}

  /* ============ Activity / Chatter ============ */
  .feed{padding:14px 18px;display:flex;flex-direction:column;gap:10px}
  .post{display:flex;gap:10px}
  .post .av{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex-shrink:0}
  .post .bd{flex:1;background:var(--surface-alt);border:1px solid var(--border-soft);border-radius:var(--radius);padding:9px 11px}
  .post .bd b{font-size:12.5px}
  .post .bd time{font-size:11px;color:var(--text-faint);margin-left:6px}
  .post .bd p{margin:4px 0 0}
  .composer{display:flex;gap:8px;padding:14px 18px 0}
  .composer textarea{flex:1;border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;min-height:62px;resize:vertical;background:var(--surface)}
  .task{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border-soft)}
  .task:last-child{border-bottom:0}
  .task input{margin-top:3px;width:15px;height:15px;accent-color:var(--brand)}
  .task .t-body{flex:1}
  .task b{font-size:12.5px;display:block}
  .task span{font-size:11.5px;color:var(--text-faint)}
  .task.done b{text-decoration:line-through;color:var(--text-faint)}

  /* ============ Modal ============ */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:100;padding:16px}
  .modal{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column;border:1px solid var(--border)}
  .modal.wide{max-width:860px}
  .mhead{padding:14px 18px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:10px}
  .mhead h2{margin:0;font-size:17px;font-weight:700}
  .mhead .x{margin-left:auto;border:0;background:transparent;font-size:20px;line-height:1;color:var(--text-weak);padding:2px 6px;border-radius:var(--radius)}
  .mhead .x:hover{background:var(--surface-alt)}
  .mbody{padding:16px 18px;overflow:auto}
  .mfoot{padding:12px 18px;border-top:1px solid var(--border-soft);display:flex;gap:8px;justify-content:flex-end;background:var(--surface-alt);border-radius:0 0 var(--radius) var(--radius)}
  .fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.fgrid2{grid-template-columns:1fr}}
  .f label{display:block;font-size:11.5px;font-weight:600;color:var(--text-weak);margin-bottom:3px}
  .f input,.f select,.f textarea{width:100%;border:1px solid var(--border);border-radius:var(--radius);padding:6px 9px;background:var(--surface)}
  .f input:invalid{border-color:var(--error)}
  .f .hint{font-size:11px;color:var(--text-faint);margin-top:3px}
  .f.span2{grid-column:1/-1}
  .errline{color:var(--error);font-size:12px;margin-top:8px}

  /* ============ Toast ============ */
  .toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toast{background:var(--success);color:#fff;padding:9px 16px;border-radius:var(--radius);box-shadow:var(--shadow-lg);font-weight:500;max-width:520px}
  .toast.err{background:var(--error)}
  .toast.info{background:var(--brand-deep)}

  /* ============ Charts ============ */
  .chartcard{padding:14px 16px}
  .chart-h{font-size:13px;font-weight:700;margin:0 0 2px}
  .chart-sub{font-size:11.5px;color:var(--text-faint);margin:0 0 12px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
  .legend span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-weak)}
  .legend i{width:10px;height:10px;border-radius:2px;display:block}
  svg .gridline{stroke:var(--grid);stroke-width:1}

/* ===================== HELPERS ===================== */
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function stageIdx(n){ for(var i=0;i<STAGES.length;i++){ if(STAGES[i].name===n) return i; } return -1; }
function probOf(n){ var i=stageIdx(n); return i<0?0:STAGES[i].prob; }
function amountOf(o){ if(o.eau==null||o.unitSet==null||o.cost==null) return null; return Math.round(o.eau*o.unitSet*o.cost); }
function usd(n){ return n==null?"—":"$"+Math.round(n).toLocaleString("en-US"); }
function k$(n){ return "$"+(Math.round(n*100)/100).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2})+"K"; }
function pillCls(s){ return s==="Closed Won"?"p-won":s==="Closed Lost"?"p-lost":(s==="Qualification"||s==="Prospecting")?"p-early":"p-open"; }
function isClosed(s){ return s==="Closed Won"||s==="Closed Lost"; }
function closeYear(c){ var m=/'(\d\d)/.exec(c||""); return m?("20"+m[1]):"—"; }
function initials(s){ return String(s||"?").replace(/[^A-Za-z ]/g,"").split(" ").filter(Boolean).slice(0,2).map(function(w){return w[0];}).join("").toUpperCase()||"?"; }
function sum(a){ return a.reduce(function(x,y){return x+(y||0);},0); }
function el(id){ return document.getElementById(id); }

/* ===================== TOTALS ===================== */
function totals(list){
  var t={count:list.length,total:0,weighted:0,won:0,lost:0,open:0,openCount:0};
  list.forEach(function(o){
    if(o.amount==null) return;
    t.total+=o.amount; t.weighted+=o.amount*o.prob/100;
    if(o.stage==="Closed Won") t.won+=o.amount;
    else if(o.stage==="Closed Lost") t.lost+=o.amount;
    else { t.open+=o.amount; t.openCount++; }
  });
  return t;
}

function visibleOpps(){
  var q=state.search.trim().toLowerCase();
  var list=state.opps.filter(function(o){
    if(state.filterStage && o.stage!==state.filterStage) return false;
    if(state.filterPL && o.productLine!==state.filterPL) return false;
    if(!q) return true;
    return [o.name,o.part,o.account,o.endCustomer,o.project,o.application,o.productLine,o.stage,o.competitor,o.next,o.note,o.close]
      .join(" ").toLowerCase().indexOf(q)>=0;
  });
  var k=state.sort.key,d=state.sort.dir;
  list.sort(function(a,b){
    var x=a[k],y=b[k];
    if(k==="close"){ x=closeSortKey(a.close); y=closeSortKey(b.close); }
    if(k==="stage"){ x=stageIdx(a.stage); y=stageIdx(b.stage); }
    if(x==null) return 1; if(y==null) return -1;
    if(typeof x==="string") return d*x.localeCompare(y);
    return d*(x-y);
  });
  return list;
}
var MONTHS={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,June:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
function closeSortKey(c){
  var m=/^([A-Za-z]+)'(\d\d)$/.exec(c||"");
  if(!m) return 999999;
  return (2000+ +m[2])*12 + (MONTHS[m[1]]||0);
}

}

function doAction(act){
  closeAllPops();
  if(act==="reset"){ state.opps=SEED.map(function(o){return Object.assign({},o);}); state.contacts=[]; state.chatter={}; state.doneTasks={}; state.nextId=9; enrich(); saveState(); render(); toast("Demo data reset to the original 8 Funnel rows","info"); }
  else if(act==="export"){ exportCSV(); }
  else if(act==="mapping"){ showMappingModal(); }
  else if(act==="source"){ showSourceModal(); }
}

el("gsearch").addEventListener("input",function(){
  state.search=this.value;
  if(state.page!=="opportunities"||state.recordId!=null){ state.recordId=null; state.page="opportunities"; }

});

/* ===================== MODAL ===================== */
function openModal(opts){
  var root=el("modalroot");
  root.innerHTML='<div class="scrim"><div class="modal'+(opts.wide?" wide":"")+'" role="dialog" aria-modal="true" aria-label="'+esc(opts.title)+'">'+
    '<div class="mhead"><h2>'+esc(opts.title)+'</h2><button class="x" data-close aria-label="Close">&times;</button></div>'+
    '<div class="mbody">'+opts.body+'</div>'+
    (opts.footer===null?"":'<div class="mfoot">'+(opts.footer||'<button class="btn" data-close>Close</button>')+'</div>')+
    '</div></div>';
  root.querySelector(".scrim").addEventListener("click",function(e){ if(e.target===this) closeModal(); });
  root.querySelectorAll("[data-close]").forEach(function(b){ b.addEventListener("click",closeModal); });
  document.addEventListener("keydown",escClose);
  if(opts.onMount) opts.onMount(root);
  var f=root.querySelector("input,select,textarea"); if(f) f.focus();
}
function closeModal(){ el("modalroot").innerHTML=""; document.removeEventListener("keydown",escClose); }
function escClose(e){ if(e.key==="Escape") closeModal(); }

function wireAmountPreview(root){
  function upd(){
    var eau=parseFloat(el("f-eau").value), ups=parseFloat(el("f-ups").value), c=parseFloat(el("f-cost").value);
    var p=el("amtpreview");
    if(isFinite(eau)&&isFinite(ups)&&isFinite(c)){
      p.innerHTML="Amount = EAU &times; Unit/Set &times; Disty Cost = <strong>"+usd(eau*ups*c)+"</strong>";
    } else { p.textContent="Amount stays blank until EAU, Unit/Set and Disty Cost are all filled in (the sheet's TBD rows behave the same way)."; }
  }
  ["f-eau","f-ups","f-cost"].forEach(function(id){ el(id).addEventListener("input",upd); });
  upd();
}
function readOppForm(){
  function n(id){ var v=parseFloat(el(id).value); return isFinite(v)?v:null; }
  var name=el("f-name").value.trim(), close=el("f-close").value.trim(), account=el("f-account").value.trim();
  if(!name||!close||!account){ return {error:"Opportunity Name, Account Name and Close Date are all required."}; }
  return {data:{
    name:name, account:account, endCustomer:el("f-end").value.trim(), region:el("f-region").value,
    owner:el("f-owner").value.trim()||"Unassigned",
    project:el("f-project").value.trim(), application:el("f-app").value.trim(),
    productLine:el("f-pl").value.trim()||"—", part:el("f-part").value.trim()||"—",
    designStatus:el("f-ds").value, competitor:el("f-comp").value.trim()||"—",
    stage:el("f-stage").value, close:close,
    eau:n("f-eau"), unitSet:n("f-ups"), cost:n("f-cost"), resale:n("f-resale"),
    next:el("f-next").value.trim()||"—", note:el("f-note").value.trim()||"—", fcst:1
  }};
}
function newOpp(){
  openModal({
    title:"New Opportunity", wide:true, body:oppForm(null),
    footer:'<button class="btn" data-close>Cancel</button><button class="btn btn-brand" id="save">Save</button>',
    onMount:function(root){
      wireAmountPreview(root);
      el("save").addEventListener("click",function(){
        var r=readOppForm();
        if(r.error){ var e=el("formerr"); e.textContent=r.error; e.classList.remove("hidden"); return; }
        r.data.id=state.nextId++;
        state.opps.push(r.data); enrich(); saveState(); closeModal(); render();
        toast("Opportunity “"+r.data.name+"” created");
      });
    }
  });
}
function editOpp(id){
  var o=state.opps.filter(function(x){return x.id===id;})[0]; if(!o) return;
  openModal({
    title:"Edit "+o.name, wide:true, body:oppForm(o),
    footer:'<button class="btn" data-close>Cancel</button><button class="btn btn-brand" id="save">Save</button>',
    onMount:function(root){
      wireAmountPreview(root);
      el("save").addEventListener("click",function(){
        var r=readOppForm();
        if(r.error){ var e=el("formerr"); e.textContent=r.error; e.classList.remove("hidden"); return; }
        Object.assign(o,r.data); enrich(); saveState(); closeModal(); render();
        toast("Opportunity saved");
      });
    }
  });
}
function deleteOpps(ids){
  var names=state.opps.filter(function(o){return ids.indexOf(o.id)>=0;}).map(function(o){return o.name;});
  openModal({
    title:ids.length>1?("Delete "+ids.length+" opportunities?"):"Delete opportunity?",
    body:'<p>This removes the following from the list view. The source spreadsheet is never touched — this app only holds a copy in your browser.</p><ul>'+
      names.map(function(n){return "<li>"+esc(n)+"</li>";}).join("")+'</ul>',
    footer:'<button class="btn" data-close>Cancel</button><button class="btn btn-danger" id="del">Delete</button>',
    onMount:function(){
      el("del").addEventListener("click",function(){
        state.opps=state.opps.filter(function(o){ return ids.indexOf(o.id)<0; });
        ids.forEach(function(i){ delete state.sel[i]; });
        if(ids.indexOf(state.recordId)>=0) state.recordId=null;
        saveState(); closeModal(); render(); toast(ids.length+" opportunity"+(ids.length>1?"s":"")+" deleted","info");

function importModal(){
  var sample="Region\tCustomer\tEnd Customer\tProject\tApplication\tProduct Line\tPart#\tDesign Status\tM/P\tEAU\tUnit/Set\tDisty Cost\tResale\nKR\tMOBIS\tHyundai/Kia\tHead Lamp\tHead Lamp\tLighting\tID805\tSample\tMar'28\t45000\t6\t0.52\t0.535";
  openModal({
    title:"Import Opportunities", wide:true,
    body:'<p>Paste rows copied straight out of the <code>Funnel</code> sheet — tab-separated, one opportunity per line. A header row is detected and skipped.</p>'+
      '<div class="f"><label for="imp">Rows</label><textarea id="imp" rows="9" style="font-family:var(--mono);font-size:11.5px">'+esc(sample)+'</textarea></div>'+
      '<div class="hint">Column order: Region, Customer, End Customer, Project, Application, Product Line, Part#, Design Status, M/P, EAU, Unit/Set, Disty Cost, Resale. Stage is mapped from Design Status.</div>'+
      '<div class="errline hidden" id="imperr"></div>',
    footer:'<button class="btn" data-close>Cancel</button><button class="btn btn-brand" id="doimp">Import</button>',
    onMount:function(){
      el("doimp").addEventListener("click",function(){
        var lines=el("imp").value.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
        if(lines.length && /region/i.test(lines[0])) lines.shift();
        if(!lines.length){ var e=el("imperr"); e.textContent="Nothing to import — paste at least one data row."; e.classList.remove("hidden"); return; }
        var added=0;
        lines.forEach(function(l){
          var c=l.split("\t").map(function(x){return x.trim();});
          if(c.length<9) return;
          function num(v){ var n=parseFloat(v); return isFinite(n)?n:null; }
          var ds=c[7]||"Sample";
          var stage = ds==="M/P"?"Closed Won" : ds==="D-IN"?"Negotiation/Review" : ds==="TBD"?"Qualification" : "Value Proposition";
          state.opps.push({
            id:state.nextId++, name:(c[1]||"New")+" – "+(c[3]||"Opportunity")+" "+(c[6]||""),
            region:c[0]||"KR", account:c[1]||"MOBIS", endCustomer:c[2]||"—", project:c[3]||"—",
            application:c[4]||"—", productLine:c[5]||"—", part:c[6]||"—", designStatus:ds,
            stage:stage, close:c[8]||"TBD", eau:num(c[9]), unitSet:num(c[10]), cost:num(c[11]), resale:num(c[12]),
            fcst:1, competitor:"TBD", note:"Imported", next:"—", owner:"Unassigned"
          });
          added++;
        });
        enrich(); saveState(); closeModal(); render();
        toast(added?(added+" opportunity"+(added>1?"s":"")+" imported"):"No valid rows found",added?"":"err");
      });
    }
  });
}
function exportCSV(){
  var cols=["Opportunity Name","Account","End Customer","Region","Project","Application","Product Line","Part#","Design Status","Stage","Probability","Close Date","EAU","Unit/Set","Disty Cost","Resale","Amount","Competitor","Next Step","Description","Owner"];
  var rows=visibleOpps().map(function(o){
    return [o.name,o.account,o.endCustomer,o.region,o.project,o.application,o.productLine,o.part,o.designStatus,o.stage,o.prob+"%",o.close,o.eau,o.unitSet,o.cost,o.resale,o.amount,o.competitor,o.next,o.note,o.owner];
  });
  var csv=[cols].concat(rows).map(function(r){
    return r.map(function(c){ c=c==null?"":String(c); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(",");
  }).join("\n");
  var ok=false;
  try{
    var blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download="mobis_opportunities.csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
    ok=true;
  }catch(e){}
  openModal({
    title:"Export — "+rows.length+" rows",
    body:(ok?"<p>Download started. If your browser blocked it, copy the CSV below.</p>":"<p>Copy the CSV below.</p>")+
      '<div class="f"><textarea rows="12" style="font-family:var(--mono);font-size:11px" readonly>'+esc(csv)+'</textarea></div>',
    footer:'<button class="btn btn-brand" data-close>Done</button>'
  });
}

/* ===================== CHART HELPERS ===================== */
function hbars(items,opts){
  opts=opts||{};
  var max=Math.max.apply(null,items.map(function(i){return i.v;}).concat([1]));
  return items.map(function(i){
    var w=Math.max(i.v>0?2:0,i.v/max*100);
    return '<div class="bar-row"><div class="bl" title="'+esc(i.l)+'">'+esc(i.l)+'</div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+w.toFixed(1)+'%;background:'+(i.c||"var(--s1)")+'"></div></div>'+
      '<div class="bv">'+(opts.fmt?opts.fmt(i.v):usd(i.v))+'</div></div>';
  }).join("");
}
function groupedColumns(cats,series,fmt){
  var W=520,H=210,padL=46,padR=10,padT=14,padB=30;
  var iw=W-padL-padR, ih=H-padT-padB;
  var max=0; series.forEach(function(s){ s.vals.forEach(function(v){ if(v>max) max=v; }); });
  max=max||1;
  var niceMax=Math.ceil(max/100)*100;
  var gw=iw/cats.length, bw=Math.min(26,(gw-14)/series.length);
  var out='<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" role="img">';
  for(var g=0;g<=4;g++){
    var y=padT+ih-(ih*g/4);
    out+='<line class="gridline" x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'"/>';
    out+='<text class="axis" x="'+(padL-6)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end">'+Math.round(niceMax*g/4)+'</text>';
  }
  cats.forEach(function(c,ci){
    var gx=padL+ci*gw;
    series.forEach(function(s,si){
      var v=s.vals[ci]||0;
      var h=Math.max(v>0?2:0,v/niceMax*ih);
      var x=gx+(gw-bw*series.length-2*(series.length-1))/2+si*(bw+2);
      var y=padT+ih-h;
      out+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+s.color+'"><title>'+esc(c+" · "+s.name+": "+fmt(v))+'</title></rect>';
      if(v>0) out+='<text class="vlabel" x="'+(x+bw/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" font-size="9.5">'+Math.round(v)+'</text>';
    });
    out+='<text class="clabel" x="'+(gx+gw/2).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle">'+esc(c)+'</text>';
  });
  out+='</svg>';
  return out;
}
function funnelChart(rows){
  var W=680,rowH=34,H=rows.length*rowH+10;
  var max=Math.max.apply(null,rows.map(function(r){return r.v;}).concat([1]));
  var out='<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" role="img">';
  rows.forEach(function(r,i){
    var w=Math.max(r.v>0?3:0,r.v/max*(W-360));
    var y=i*rowH+6;
    out+='<text class="clabel" x="150" y="'+(y+15)+'" text-anchor="end">'+esc(r.l)+'</text>';
    out+='<rect x="158" y="'+y+'" width="'+w.toFixed(1)+'" height="20" rx="4" fill="'+r.c+'"><title>'+esc(r.l+": "+usd(r.v))+'</title></rect>';
    out+='<text class="vlabel" x="'+(158+w+7).toFixed(1)+'" y="'+(y+14.5)+'">'+(r.v?usd(r.v):"—")+'</text>';
    out+='<text class="axis" x="'+(W-4)+'" y="'+(y+14.5)+'" text-anchor="end">'+r.n+'</text>';
  });
  out+='</svg>';
  return out;
}
function legend(items){
  return '<div class="legend">'+items.map(function(i){
    return '<span><i style="background:'+i.c+'"></i>'+esc(i.l)+'</span>';
  }).join("")+'</div>';
}

/* ===================== PAGES ===================== */
function render(){
  renderNav();
  var app=el("app");
  if(state.page==="opportunities" && state.recordId!=null){ app.innerHTML=recordPage(); return; }
  if(state.page==="accounts" && state.accountName){ app.innerHTML=accountPage(); return; }
  if(state.page==="products" && state.productPart){ app.innerHTML=productPage(); return; }
  if(state.page==="reports" && state.reportId){ app.innerHTML=reportPage(); return; }

  switch(state.page){
    case "home": app.innerHTML=homePage(); break;
    case "opportunities": app.innerHTML=oppsPage(); if(state.view==="kanban") wireDnD(); break;
    case "accounts": app.innerHTML=accountsPage(); break;
    case "contacts": app.innerHTML=contactsPage(); break;
    case "products": app.innerHTML=productsPage(); break;
    case "forecasts": app.innerHTML=forecastsPage(); break;
    case "reports": app.innerHTML=reportsPage(); break;
    case "dashboards": app.innerHTML=dashboardsPage(); break;
  }
}

/* ---------- HOME ---------- */
function homePage(){
  var t=totals(state.opps);
  var open=state.opps.filter(function(o){ return !isClosed(o.stage); })
    .sort(function(a,b){ return closeSortKey(a.close)-closeSortKey(b.close); });
  var tasks=state.opps.filter(function(o){ return o.next && o.next!=="—" && !isClosed(o.stage); });
  var cy25=sum(FCST.map(function(f){return sum(f.r25);}));
  var cy26=sum(FCST.map(function(f){return sum(f.r26);}));

  return pageHeader(ICON_OPP,"","Sales","Korea Region — MOBIS account team",
      "Quarterly performance is read from the FCST_Revenue sheet · pipeline from Funnel",
      '<button class="btn" data-act="mapping">Stage mapping</button><button class="btn btn-brand" id="newopp">New Opportunity</button>')+
    '<div class="tiles" style="margin:10px 0">'+
      tile("Open Pipeline",usd(t.open),t.openCount+" open opportunities",t.total?t.open/t.total*100:0)+
      tile("Weighted Forecast",usd(t.weighted),"Amount × stage probability",t.total?t.weighted/t.total*100:0)+
      tile("Closed Won",usd(t.won),"Booked design wins",t.total?t.won/t.total*100:0)+
      tile("CY25 Forecast Revenue",k$(cy25),"CY26: "+k$(cy26),cy26?cy25/cy26*100:0)+
    '</div>'+
    '<div class="cols2">'+
      '<div class="stack">'+
        '<div class="card"><div class="toolbar"><b>My Open Opportunities</b><span class="count">'+open.length+' records · closing soonest first</span>'+
          '<span class="grow"></span><button class="btn btn-sm" data-go="opportunities">View all</button></div>'+
          '<div class="tw"><table class="lv" style="min-width:600px"><thead><tr>'+
            '<th class="pad">Opportunity</th><th class="pad">Stage</th><th class="pad num">Amount</th><th class="pad num">Close</th></tr></thead><tbody>'+
            open.map(function(o){
              return '<tr><td><button class="lnk" data-open="'+o.id+'">'+esc(o.name)+'</button><span class="sub">'+esc(o.part)+'</span></td>'+
                '<td><span class="pill '+pillCls(o.stage)+'">'+esc(o.stage)+'</span></td>'+
                '<td class="num">'+usd(o.amount)+'</td><td class="num">'+esc(o.close)+'</td></tr>';
            }).join("")+
          '</tbody></table></div></div>'+
        '<div class="card chartcard"><h3 class="chart-h">Pipeline by stage</h3>'+
          '<p class="chart-sub">Open amount per stage, MOBIS Design Funnel</p>'+
          hbars(STAGES.filter(function(s){return !isClosed(s.name);}).map(function(s){
            return {l:s.name,v:sum(state.opps.filter(function(o){return o.stage===s.name;}).map(function(o){return o.amount||0;}))};
          }).filter(function(i){return i.v>0;}))+
        '</div>'+
      '</div>'+
      '<div class="stack">'+
        '<div class="card"><div class="toolbar"><b>Today\'s Tasks</b><span class="count">from Next Action</span></div>'+
          '<div style="padding:6px 16px 12px">'+tasks.map(function(o){
            var done=!!state.doneTasks[o.id];
            return '<div class="task'+(done?" done":"")+'"><input type="checkbox" data-task="'+o.id+'"'+(done?" checked":"")+' aria-label="Complete task" />'+
              '<div class="t-body"><b>'+esc(o.next)+'</b><span>'+esc(o.name)+' · '+esc(o.close)+'</span></div></div>';
          }).join("")+'</div></div>'+
        '<div class="card"><div class="toolbar"><b>Recent Records</b></div>'+
          '<div style="padding:4px 0">'+state.opps.slice(0,5).map(function(o){
            return '<button class="row" style="display:block;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--border-soft);padding:9px 16px" data-open="'+o.id+'">'+

              '<span style="font-size:11px;color:var(--text-faint)">'+esc(o.stage)+' · '+usd(o.amount)+'</span></button>';
          }).join("")+'</div></div>'+
      '</div>'+
    '</div>';
}
function tile(l,v,s,bar){
  return '<div class="card tile"><div class="tile-l">'+esc(l)+'</div><div class="tile-v num">'+esc(v)+'</div>'+
    '<div class="tile-s">'+esc(s)+'</div><div class="tile-bar"><i style="width:'+Math.max(0,Math.min(100,bar||0)).toFixed(1)+'%"></i></div></div>';
}

/* ---------- OPPORTUNITIES ---------- */

  var pls=[]; state.opps.forEach(function(o){ if(pls.indexOf(o.productLine)<0) pls.push(o.productLine); });

  var head=pageHeader(ICON_OPP,"","Opportunities","MOBIS Design Funnel",
    list.length+" items · sorted by "+esc(state.sort.key)+" · "+(state.search?("matching “"+esc(state.search)+"” · "):"")+"filtered by Region: KR",
    '<button class="btn" id="btn-import">Import</button>'+
    '<button class="btn" id="btn-export">Export</button>'+
    '<button class="btn" id="btn-owner"'+(selIds.length?"":" disabled")+'>Change Owner'+(selIds.length?" ("+selIds.length+")":"")+'</button>'+

    '<button class="btn btn-brand" id="newopp">New</button>');

    tile("Total Pipeline",usd(t.total),t.count+" opportunities"+(list.filter(function(o){return o.amount==null;}).length?" · "+list.filter(function(o){return o.amount==null;}).length+" without an amount":""),100)+
    tile("Open Pipeline",usd(t.open),t.openCount+" open",t.total?t.open/t.total*100:0)+
    tile("Weighted Forecast",usd(t.weighted),"Amount × probability",t.total?t.weighted/t.total*100:0)+
    tile("Closed Won",usd(t.won),t.lost?("Closed Lost: "+usd(t.lost)):"No losses recorded",t.total?t.won/t.total*100:0)+
  '</div>';

  var toolbar='<div class="toolbar">'+
    '<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-weak)">'+
      '<input type="checkbox" id="selall" '+(selIds.length&&selIds.length===list.length?"checked":"")+' aria-label="Select all" /> Select all</label>'+
    '<span class="count">'+list.length+' items · '+usd(t.total)+' total · '+usd(t.weighted)+' weighted</span>'+
    '<select class="filter" id="f-stage-filter"><option value="">All stages</option>'+
      STAGES.map(function(s){ return '<option'+(state.filterStage===s.name?" selected":"")+'>'+esc(s.name)+'</option>'; }).join("")+'</select>'+
    '<select class="filter" id="f-pl-filter"><option value="">All product lines</option>'+
      pls.map(function(p){ return '<option'+(state.filterPL===p?" selected":"")+'>'+esc(p)+'</option>'; }).join("")+'</select>'+
    (state.search||state.filterStage||state.filterPL?'<button class="btn btn-sm" id="clearf">Clear filters</button>':"")+
    '<span class="grow"></span>'+
    '<div class="switch"><button id="v-table" class="'+(state.view==="table"?"on":"")+'">Table</button>'+
      '<button id="v-kanban" class="'+(state.view==="kanban"?"on":"")+'">Kanban</button>'+
      '<button id="v-split" class="'+(state.view==="split"?"on":"")+'">Compact</button></div>'+
  '</div>';

  var body;
  if(!list.length){
    body='<div class="empty"><b>No opportunities match</b>Try clearing the search or filters.</div>';
  } else if(state.view==="kanban"){
    body=kanbanHTML(list);
  } else {
    body=tableHTML(list,state.view==="split");
  }

  return head+tiles+'<div class="card">'+toolbar+body+'</div>'+mappingNote();

function sortTh(key,label,isNum){
  var on=state.sort.key===key;
  return '<th class="'+(isNum?"num ":"")+(on?"sorted":"")+'"><button data-sort="'+key+'">'+esc(label)+
    '<span class="arrow">'+(on?(state.sort.dir>0?"▲":"▼"):"▲")+'</span></button></th>';
}
function tableHTML(list,compact){
  var cols = compact
    ? sortTh("name","Opportunity Name")+sortTh("stage","Stage")+sortTh("amount","Amount",true)+sortTh("close","Close Date",true)
    : sortTh("name","Opportunity Name")+'<th class="pad">Account / End Customer</th>'+sortTh("stage","Stage")+
      sortTh("amount","Amount",true)+sortTh("close","Close Date",true)+sortTh("prob","Probability",true)+
      sortTh("productLine","Product")+'<th class="pad">Next Step</th><th class="pad"></th>';
  return '<div class="tw"><table class="lv"'+(compact?' style="min-width:520px"':'')+'><thead><tr><th class="pad" style="width:34px"></th>'+cols+'</tr></thead><tbody>'+
    list.map(function(o){
      var sel=!!state.sel[o.id];
      var base='<tr class="'+(sel?"sel":"")+'">'+
        '<td><input type="checkbox" data-sel="'+o.id+'" '+(sel?"checked":"")+' aria-label="Select '+esc(o.name)+'" /></td>'+
        '<td><button class="lnk" data-open="'+o.id+'">'+esc(o.name)+'</button><span class="sub">'+esc(o.part)+' · '+esc(o.application)+'</span></td>';
      if(compact){
        return base+'<td><span class="pill '+pillCls(o.stage)+'">'+esc(o.stage)+'</span></td>'+
          '<td class="num">'+usd(o.amount)+'</td><td class="num">'+esc(o.close)+'</td></tr>';
      }
      return base+
        '<td>'+esc(o.account)+'<span class="sub">'+esc(o.endCustomer)+'</span></td>'+
        '<td><span class="pill '+pillCls(o.stage)+'">'+esc(o.stage)+'</span><span class="sub">Sheet: '+esc(o.designStatus)+'</span></td>'+
        '<td class="num">'+usd(o.amount)+(o.amount==null?'<span class="sub">TBD</span>':'<span class="sub">'+o.eau.toLocaleString("en-US")+' × '+o.unitSet+'</span>')+'</td>'+
        '<td class="num">'+esc(o.close)+'</td>'+
        '<td class="num"><div class="probwrap"><div class="probbar"><i style="width:'+o.prob+'%"></i></div><span>'+o.prob+'%</span></div></td>'+
        '<td>'+esc(o.productLine)+'<span class="sub">'+esc(o.project)+'</span></td>'+
        '<td><div class="trunc" title="'+esc(o.next)+'">'+esc(o.next)+'</div><span class="sub trunc" title="'+esc(o.note)+'">'+esc(o.note)+'</span></td>'+
        '<td><button class="rowmenu" data-edit="'+o.id+'" title="Edit">✎</button></td></tr>';
    }).join("")+'</tbody></table></div>';
}
function kanbanHTML(list){
  return '<div class="kbwrap"><div class="kb">'+STAGES.map(function(st){
    var inS=list.filter(function(o){ return o.stage===st.name; });
    var s=sum(inS.map(function(o){ return o.amount||0; }));
    var cards=inS.length?inS.map(function(o){
      var cls=o.stage==="Closed Won"?" won":o.stage==="Closed Lost"?" lost":"";
      return '<div class="kcard'+cls+'" draggable="true" data-card="'+o.id+'" tabindex="0" role="button">'+
        '<b>'+esc(o.name)+'</b><div class="kamt num">'+usd(o.amount)+'</div>'+
        '<div class="kmeta num">'+esc(o.close)+' · '+o.prob+'%</div>'+
        '<div class="kmeta">'+esc(o.competitor)+'</div></div>';
    }).join(""):'<div class="kempty">Drop here</div>';
    return '<div class="kcol"><div class="khead"><b>'+esc(st.name)+'</b><span class="num">'+inS.length+' · '+usd(s)+'</span></div>'+
      '<div class="kbody" data-drop="'+esc(st.name)+'">'+cards+'</div></div>';
  }).join("")+'</div></div>';
}
function mappingNote(){
  return '<div class="card note" style="margin-top:10px"><h3>How the sheet maps to Salesforce</h3>'+
    '<div class="tw"><table><thead><tr><th>Funnel status</th><th>Stage</th><th>Prob.</th><th>Signal used</th></tr></thead><tbody>'+
    STAGE_MAP.map(function(r){ return '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td class="num">'+r[2]+'%</td><td>'+esc(r[3])+'</td></tr>'; }).join("")+
    '</tbody></table></div>'+
    '<p><strong>Derived fields.</strong> Amount = <code>EAU × Unit/Set × Disty Cost</code> — the Funnel sheet has no revenue column. Probability is the Salesforce stage default. Close Date is the sheet\'s <code>M/P</code> start-of-production date in its original <code>Mon\'YY</code> form. Owner reads “Unassigned” because the sheet records no rep.</p>'+
    '<p><strong>Carried-over data issues.</strong> Column J is labelled <code>[Kpcs]</code> but holds figures like 294,009 — as thousands that would be 294 billion units, so amounts here read it as raw units. <code>ID511</code> is almost entirely <code>TBD</code> and so carries no Amount. <em>Prospecting</em> and <em>Closed Lost</em> are empty because nothing in the sheet belongs there.</p></div>';
}

/* ---------- RECORD ---------- */
function recordPage(){
  var o=state.opps.filter(function(x){return x.id===state.recordId;})[0];
  if(!o) return '<div class="card empty"><b>Record not found</b><button class="btn" data-go="opportunities">Back to list</button></div>';
  var si=stageIdx(o.stage), won=o.stage==="Closed Won", lost=o.stage==="Closed Lost";
  var nextStage = si>=0 && si<7 ? STAGES[si+1].name : "Closed Won";

  var path='<ol class="path">'+STAGES.map(function(st,k){
    var cls="";
    if(st.name==="Closed Won"&&won) cls="won";
    else if(st.name==="Closed Lost"&&lost) cls="lost";
    else if(k<si) cls="done";
    else if(k===si) cls="cur";
    return '<li><button class="'+cls+'" data-stage="'+esc(st.name)+'" title="Set stage to '+esc(st.name)+'">'+esc(st.name)+'</button></li>';
  }).join("")+'</ol>';

  var hl=[["Amount",usd(o.amount)],["Close Date (M/P)",o.close],["Stage",o.stage],["Probability",o.prob+"%"],["Owner",o.owner||"Unassigned"]]
    .map(function(p){ return '<div><div class="lbl">'+esc(p[0])+'</div><div class="val num">'+esc(p[1])+'</div></div>'; }).join("");

  var tabs=["Details","Activity","Chatter","Products","Related"];
  var tabsHTML='<div class="rtabs">'+tabs.map(function(t){
    return '<button class="'+(state.recordTab===t?"on":"")+'" data-rtab="'+t+'">'+t+'</button>';
  }).join("")+'</div>';

  var pane;
  if(state.recordTab==="Details") pane=detailsPane(o);
  else if(state.recordTab==="Activity") pane=activityPane(o);
  else if(state.recordTab==="Chatter") pane=chatterPane(o);
  else if(state.recordTab==="Products") pane=productsPane(o);
  else pane=relatedPane(o);

  return '<button class="back" data-go="opportunities"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 3.5L7 12l8.5 8.5 1.8-1.8L10.6 12l6.7-6.7z"/></svg> Back to MOBIS Design Funnel</button>'+
    '<div class="card"><div class="phead"><div class="ricon">'+ICON_OPP+'</div>'+
      '<div class="ptext"><div class="peyebrow">Opportunity</div><h1 class="ptitle">'+esc(o.name)+'</h1>'+
      '<div class="pmeta">'+esc(o.account)+' · '+esc(o.endCustomer)+' · Region '+esc(o.region)+' · Part '+esc(o.part)+'</div></div>'+
      '<div class="pactions">'+
        '<button class="btn" id="rec-edit">Edit</button>'+
        '<button class="btn" id="rec-clone">Clone</button>'+
        '<button class="btn btn-danger" id="rec-del">Delete</button>'+
        (isClosed(o.stage)?'<button class="btn" id="rec-reopen">Reopen</button>'
          :'<button class="btn btn-brand" id="rec-advance">Mark Stage as Complete</button>')+
      '</div></div>'+
      '<div class="hl">'+hl+'</div></div>'+
    '<div class="card" style="margin-top:10px"><div class="pathwrap"><div class="pathscroll">'+path+'</div>'+
      '<div class="pathstatus"><span class="lbl">Key Fields</span><span class="val">'+esc(o.next)+'</span>'+
      (isClosed(o.stage)?"":'<span class="lbl">· next stage: '+esc(nextStage)+'</span>')+'</div></div>'+
      tabsHTML+pane+'</div>';
}
function detailsPane(o){
  var margin=(o.resale&&o.cost)?((o.resale-o.cost)/o.resale*100).toFixed(2)+"%":"—";
  var f=[
    ["S","Opportunity Information"],
    ["Opportunity Name",o.name],["Account Name",o.account],["End Customer",o.endCustomer],
    ["Region",o.region],["Owner",o.owner||"Unassigned"],["Type","New Design Win"],
    ["S","Product & Design"],
    ["Project Name",o.project],["Application",o.application],["Product Line",o.productLine],
    ["Part Number",o.part],["Design Status (sheet)",o.designStatus],["Competitor Part#",o.competitor],
    ["S","Volume & Pricing"],
    ["EAU",o.eau==null?"TBD":o.eau.toLocaleString("en-US")],
    ["Unit / Set",o.unitSet==null?"TBD":String(o.unitSet)],
    ["Disty Cost (ASP)",o.cost==null?"TBD":"$"+o.cost],
    ["Resale (ASP)",o.resale==null?"TBD":"$"+o.resale],
    ["Disty Margin",margin],["Amount (derived)",usd(o.amount)],["FCST Flag",String(o.fcst)],
    ["S","Forecast & Next Steps"],
    ["Stage",o.stage],["Probability (%)",o.prob+"%"],["Close Date (M/P SoP)",o.close],
    ["Expected Revenue",o.amount==null?"—":usd(o.amount*o.prob/100)],
    ["Next Step",o.next],["Description",o.note]
  ];
  return '<dl class="fgrid">'+f.map(function(x){
    if(x[0]==="S") return '<div class="shead">'+esc(x[1])+'</div>';
    return '<div class="fld"><dt>'+esc(x[0])+'</dt><dd class="num">'+esc(x[1])+'</dd></div>';
  }).join("")+'</dl>';
}
function activityPane(o){
  var items=[];
  if(o.next&&o.next!=="—") items.push({t:"Next Step",b:o.next,m:"Open task · from the Funnel sheet"});
  if(o.note&&o.note!=="—") items.push({t:"Project Status",b:o.note,m:"Logged note · Pjt. Status/Note column"});
  items.push({t:"Close Date",b:"Mass production starts "+o.close,m:"Milestone · M/P column"});
  if(o.competitor&&o.competitor!=="TBD"&&o.competitor!=="—") items.push({t:"Competitive",b:"Displacing "+o.competitor,m:"Competitor Part# column"});
  return '<div class="feed">'+items.map(function(i){
    return '<div class="post"><div class="av">'+esc(initials(i.t))+'</div><div class="bd"><b>'+esc(i.t)+'</b>'+
      '<time>'+esc(i.m)+'</time><p>'+esc(i.b)+'</p></div></div>';
  }).join("")+
  '<p style="font-size:12px;color:var(--text-faint);margin-top:6px">Every item above is text carried from the sheet — no activity history was invented.</p></div>';
}
function chatterPane(o){

    '<textarea id="chattertext" placeholder="Share an update on '+esc(o.name)+'…"></textarea></div>'+
    '<div style="padding:8px 18px 0;display:flex;justify-content:flex-end"><button class="btn btn-brand btn-sm" id="chatterpost">Share</button></div>'+
    '<div class="feed">'+(posts.length?posts.map(function(p){
      return '<div class="post"><div class="av">KR</div><div class="bd"><b>Korea Region</b><time>'+esc(p.time)+'</time><p>'+esc(p.text)+'</p></div></div>';
    }).join(""):'<div class="empty" style="padding:20px"><b>No posts yet</b>Share the first update on this opportunity.</div>')+'</div>';
}
function productsPane(o){
  return '<div class="tw"><table class="lv" style="min-width:640px"><thead><tr>'+
    '<th class="pad">Product</th><th class="pad">Product Line</th><th class="pad num">Quantity (EAU × Unit/Set)</th>'+
    '<th class="pad num">Sales Price</th><th class="pad num">Total Price</th></tr></thead><tbody>'+
    '<tr><td><button class="lnk" data-product="'+esc(o.part)+'">'+esc(o.part)+'</button><span class="sub">'+esc(o.application)+'</span></td>'+
    '<td>'+esc(o.productLine)+'</td>'+
    '<td class="num">'+(o.eau==null?"TBD":(o.eau*o.unitSet).toLocaleString("en-US"))+'</td>'+
    '<td class="num">'+(o.cost==null?"TBD":"$"+o.cost)+'</td>'+
    '<td class="num">'+usd(o.amount)+'</td></tr></tbody></table></div>'+
    '<p style="padding:0 18px 14px;font-size:12px;color:var(--text-faint)">Quantity is EAU multiplied by Unit/Set — the number of devices, not the number of vehicle sets.</p>';

function relatedPane(o){
  var sameAccount=state.opps.filter(function(x){ return x.account===o.account && x.id!==o.id; });
  var samePart=state.opps.filter(function(x){ return x.part===o.part && x.id!==o.id; });
  var fc=FCST.filter(function(f){ return f.part===o.part; });
  return '<div style="padding:14px 18px">'+
    '<h3 style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-weak);margin:0 0 8px">Other opportunities at '+esc(o.account)+' ('+sameAccount.length+')</h3>'+
    (sameAccount.length?'<div class="tw"><table class="lv" style="min-width:520px"><tbody>'+sameAccount.map(function(x){
      return '<tr><td><button class="lnk" data-open="'+x.id+'">'+esc(x.name)+'</button></td>'+

    groups.map(function(g){
      var gt=sum(g.rows.map(function(o){return o.amount||0;}));
      return '<tr style="background:var(--surface-alt)"><td colspan="3"><b>'+esc(g.key)+'</b>'+(g.extra?' <span class="sub" style="display:inline;margin-left:6px">'+esc(g.extra)+'</span>':"")+'</td>'+
        '<td class="num"><b>'+usd(gt)+'</b></td><td class="num">'+g.rows.length+' rec</td><td></td></tr>'+
        g.rows.map(function(o){
          return '<tr><td style="padding-left:26px"><button class="lnk" data-open="'+o.id+'">'+esc(o.name)+'</button></td>'+
            '<td>'+esc(o.account)+'</td><td>'+esc(o.part)+'</td><td class="num">'+usd(o.amount)+'</td>'+
            '<td class="num">'+o.prob+'%</td><td class="num">'+esc(o.close)+'</td></tr>';
        }).join("");
    }).join("")+
    '<tr style="background:var(--surface-alt);font-weight:700"><td colspan="3">Grand Total</td><td class="num">'+usd(grand.total)+'</td>'+
    '<td class="num">'+state.opps.length+' rec</td><td></td></tr>'+
    '</tbody></table></div></div>'+
    (footNote?'<div class="card note" style="margin-top:10px"><h3>Note</h3><p>'+esc(footNote)+'</p></div>':"");
}

/* ---------- DASHBOARDS ---------- */
function dashboardsPage(){
  var t=totals(state.opps);
  var funnelRows=STAGES.filter(function(s){return !isClosed(s.name);}).map(function(s){
    var rows=state.opps.filter(function(o){return o.stage===s.name;});
    return {l:s.name,v:sum(rows.map(function(o){return o.amount||0;})),n:rows.length+" opp"+(rows.length===1?"":"s"),c:"var(--s1)"};
  });
  var byPL={},byYear={};
  state.opps.forEach(function(o){
    byPL[o.productLine]=(byPL[o.productLine]||0)+(o.amount||0);
    var y=closeYear(o.close); byYear[y]=(byYear[y]||0)+(o.amount||0);
  });
  var q25=[0,1,2,3].map(function(i){ return sum(FCST.map(function(f){return f.r25[i];})); });
  var q26=[0,1,2,3].map(function(i){ return sum(FCST.map(function(f){return f.r26[i];})); });

  return pageHeader(ICON_DASH,"dash","Dashboards","MOBIS Funnel Overview",
      "Pipeline from the Funnel sheet · revenue from FCST_Revenue · refreshed from the live record set","")+
    '<div class="tiles" style="margin:10px 0">'+
      tile("Total Pipeline",usd(t.total),t.count+" opportunities",100)+
      tile("Weighted Forecast",usd(t.weighted),Math.round(t.total?t.weighted/t.total*100:0)+"% of total",t.total?t.weighted/t.total*100:0)+
      tile("Largest Opportunity",usd(Math.max.apply(null,state.opps.map(function(o){return o.amount||0;}))),
        (state.opps.slice().sort(function(a,b){return (b.amount||0)-(a.amount||0);})[0]||{}).part||"—",100)+
      tile("Avg. Disty Margin","2.49%","flat across every part",100)+
    '</div>'+
    '<div class="card chartcard"><h3 class="chart-h">Open pipeline funnel</h3>'+
      '<p class="chart-sub">Amount by stage, earliest stage at top — record count at right</p>'+
      funnelChart(funnelRows)+'</div>'+
    '<div class="charts2" style="margin-top:10px">'+
      '<div class="card chartcard"><h3 class="chart-h">Pipeline by product line</h3><p class="chart-sub">Total amount</p>'+
        hbars(Object.keys(byPL).map(function(k,i){ return {l:k,v:byPL[k],c:["var(--s1)","var(--s2)","var(--s3)","var(--s4)"][i%4]}; }))+'</div>'+
      '<div class="card chartcard"><h3 class="chart-h">Pipeline by mass-production year</h3><p class="chart-sub">When revenue actually starts</p>'+
        hbars(Object.keys(byYear).sort().map(function(k){ return {l:k,v:byYear[k],c:"var(--s3)"}; }))+'</div>'+
    '</div>'+
    '<div class="card chartcard" style="margin-top:10px"><h3 class="chart-h">Forecast revenue by quarter</h3>'+
      '<p class="chart-sub">FCST_Revenue sheet, $K</p>'+
      legend([{l:"CY25",c:"var(--s1)"},{l:"CY26",c:"var(--s2)"}])+
      groupedColumns(["Q1","Q2","Q3","Q4"],[
        {name:"CY25",vals:q25,color:"var(--s1)"},{name:"CY26",vals:q26,color:"var(--s2)"}
      ],function(v){return k$(v);})+
    '</div>';
}

/* ===================== WIRING =====================
   Delegated handlers are attached to #app exactly once, at boot.
   render() only replaces #app's innerHTML, so re-attaching per render
   would stack duplicate handlers and fire each action N times. */
function wireOnce(){
  var app=el("app");

  app.addEventListener("click",function(e){
    var b;
    /* --- record-scoped actions --- */
    var o=state.recordId!=null ? state.opps.filter(function(x){return x.id===state.recordId;})[0] : null;
    if(o && state.page==="opportunities"){
      if((b=e.target.closest("[data-rtab]"))){ state.recordTab=b.dataset.rtab; render(); return; }
      if((b=e.target.closest("[data-stage]"))){
        var to=b.dataset.stage;
        if(o.stage!==to){ o.stage=to; enrich(); saveState(); render(); toast("Stage set to "+to); }
        return;
      }
      if(e.target.id==="rec-edit"){ editOpp(o.id); return; }
      if(e.target.id==="rec-del"){ deleteOpps([o.id]); return; }
      if(e.target.id==="rec-clone"){
        var c=Object.assign({},o); c.id=state.nextId++; c.name=o.name+" (Clone)";
        state.opps.push(c); enrich(); saveState(); go("opportunities",{recordId:c.id}); toast("Opportunity cloned"); return;
      }
      if(e.target.id==="rec-advance"){
        var i=stageIdx(o.stage);
        var to2 = i>=0 && i<7 ? STAGES[i+1].name : "Closed Won";
        o.stage=to2; enrich(); saveState(); render();
        toast(to2==="Closed Won"?("🎉 "+o.name+" marked Closed Won"):("Stage advanced to "+to2));
        return;
      }
      if(e.target.id==="rec-reopen"){ o.stage="Negotiation/Review"; enrich(); saveState(); render(); toast("Opportunity reopened at Negotiation/Review","info"); return; }
      if(e.target.id==="chatterpost"){
        var ta=el("chattertext"), v=ta.value.trim();
        if(!v){ toast("Write something first","err"); return; }
        if(!state.chatter[o.id]) state.chatter[o.id]=[];
        state.chatter[o.id].unshift({text:v,time:"just now"});
        saveState(); render(); toast("Posted to Chatter");
        return;
      }
    }

    /* --- list-scoped actions --- */
    if((b=e.target.closest("[data-sort]"))){
      var k=b.dataset.sort;
      state.sort = state.sort.key===k ? {key:k,dir:-state.sort.dir} : {key:k,dir:1};
      render(); return;
    }
    if((b=e.target.closest("[data-edit]"))){ editOpp(+b.dataset.edit); return; }
    if(e.target.id==="btn-import"){ importModal(); return; }
    if(e.target.id==="clearf"){ state.search=""; el("gsearch").value=""; state.filterStage=""; state.filterPL=""; render(); return; }
    if(e.target.id==="v-table"){ state.view="table"; render(); return; }
    if(e.target.id==="v-kanban"){ state.view="kanban"; render(); return; }
    if(e.target.id==="v-split"){ state.view="split"; render(); return; }
    if(e.target.id==="btn-owner"){ changeOwner(selectedIds()); return; }
    if(e.target.id==="btn-del"){ deleteOpps(selectedIds()); return; }
    if((b=e.target.closest("[data-card]"))){ go("opportunities",{recordId:+b.dataset.card}); return; }

    /* --- generic navigation --- */
    if((b=e.target.closest("[data-open]"))){ go("opportunities",{recordId:+b.dataset.open}); return; }
    if((b=e.target.closest("[data-go]"))){ go(b.dataset.go,{recordId:null,accountName:null,productPart:null,reportId:null}); return; }
    if((b=e.target.closest("[data-account]"))){ go("accounts",{accountName:b.dataset.account}); return; }
    if((b=e.target.closest("[data-product]"))){ go("products",{productPart:b.dataset.product}); return; }
    if((b=e.target.closest("[data-report]"))){ go("reports",{reportId:b.dataset.report}); return; }
    if((b=e.target.closest("[data-act]"))){ doAction(b.dataset.act); return; }
    if((b=e.target.closest("[data-delcontact]"))){ state.contacts.splice(+b.dataset.delcontact,1); saveState(); render(); toast("Contact deleted","info"); return; }
    if(e.target.id==="newopp"){ newOpp(); return; }
    if(e.target.id==="newcontact"){ newContact(); return; }
    if(e.target.id==="btn-export"){ exportCSV(); return; }
  });
  app.addEventListener("change",function(e){
    var t=e.target.closest("[data-task]");
    if(t){ state.doneTasks[t.dataset.task]=t.checked; saveState(); render(); return; }
    var c=e.target.closest("[data-sel]");
    if(c){ state.sel[c.dataset.sel]=c.checked; render(); return; }
    if(e.target.id==="selall"){
      var on=e.target.checked; state.sel={};
      if(on) visibleOpps().forEach(function(o){ state.sel[o.id]=true; });
      render(); return;
    }
    if(e.target.id==="f-stage-filter"){ state.filterStage=e.target.value; render(); return; }
    if(e.target.id==="f-pl-filter"){ state.filterPL=e.target.value; render(); return; }
  });
}

/* Kanban drag & drop — bound per render, because the cards are new nodes each time. */
function wireDnD(){
  var app=el("app");
  app.querySelectorAll("[data-card]").forEach(function(card){
    card.addEventListener("dragstart",function(e){
      e.dataTransfer.setData("text/plain",card.dataset.card);
      e.dataTransfer.effectAllowed="move";
      card.classList.add("drag");
    });
    card.addEventListener("dragend",function(){ card.classList.remove("drag"); });
    card.addEventListener("keydown",function(e){
      if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go("opportunities",{recordId:+card.dataset.card}); }
    });
  });
  app.querySelectorAll("[data-drop]").forEach(function(zone){
    zone.addEventListener("dragover",function(e){ e.preventDefault(); e.dataTransfer.dropEffect="move"; zone.classList.add("over"); });
    zone.addEventListener("dragleave",function(){ zone.classList.remove("over"); });
    zone.addEventListener("drop",function(e){
      e.preventDefault(); zone.classList.remove("over");
      var id=+e.dataTransfer.getData("text/plain");
      var o=state.opps.filter(function(x){return x.id===id;})[0];
      if(!o) return;
      var to=zone.dataset.drop;
      if(o.stage===to) return;
      o.stage=to; enrich(); saveState(); render();
      toast(o.name+" moved to "+to);
    });
  });
}
function selectedIds(){ return Object.keys(state.sel).filter(function(k){return state.sel[k];}).map(Number); }

/* ===================== BOOT ===================== */
wireOnce();
render();
})();
</script>
