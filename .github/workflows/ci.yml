# Continuous integration for the Opportunity Tracking Agent.
# Backend: the full pytest suite on a plain venv (SQLite, fakeredis, on-disk
# object storage -- exactly what runs locally). Frontend: typecheck and build.
# Then the two one-command deliverables, so a change that breaks the Phase 0
# report or the walkthrough fails the build rather than the demo.
name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deliverables/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Phase 0 findings report reproduces all twelve documented findings
        run: python -m scripts.findings_report
      - name: Walkthrough builds from the real workbook into a fresh database
        run: python -m scripts.walkthrough
      - name: Generated docs are current
        run: |
          python -m scripts.generate_docs
          git diff --exit-code -- ../docs/generated || (echo "docs/generated is stale: run scripts.generate_docs and commit" && exit 1)
      - name: Migrations apply to an empty database and roll back
        run: |
          rm -f opptrack.db
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deliverables/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: deliverables/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Backend image builds
        run: docker build -t opptrack-backend deliverables/backend
      - name: Frontend image builds
        run: docker build -t opptrack-frontend deliverables/frontend
      - name: Compose file is valid
        run: docker compose -f deliverables/docker-compose.yml config > /dev/null
